# One place so that `-n auto` is safe in this repo.
#
# These suites share one in-process database per process: each test
# module sets DATABASE_URL at import and the FIRST module to import
# `app` wins, so several modules deliberately read rows another one
# created. Plain `-n auto` hands a different set of modules to each
# worker, so the "first module" differs per worker and those suites
# fail for a reason that has nothing to do with the code — measured
# on 17 Nov: 2 false failures in a three-file run, none serially.
#
# `--dist loadfile` keeps every test in a file on one worker, which
# is what makes the parallel run agree with the serial one.
[pytest]
addopts = --dist loadfile
testpaths = tests
