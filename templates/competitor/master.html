<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Competitors — Procam CRM</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_prefix }}/static/css/crm.css">
</head>
<body>
{% include "_crm_topbar.html" %}
<div class="crm-wrap">

<div class="hero">
  <div>
    <h1>Competitors</h1>
    <div style="color:var(--text-2);font-size:13px;margin-top:4px">
      Canonical competitor master — one row per company.
    </div>
  </div>
  <div>
    <a class="btn" href="{{ url_prefix }}/competitors/dashboard">Dashboard</a>
    <a class="btn" href="{{ url_prefix }}/my-work">My Work</a>
    <button class="btn primary" onclick="openCreate()">+ New Competitor</button>
  </div>
</div>

<div class="filters">
  <input id="fSearch" placeholder="Search by name / alias" oninput="renderTable()" style="flex:1">
</div>

<table>
  <thead>
    <tr>
      <th>Name</th><th>Country</th><th>City</th>
      <th>Services</th><th>Verticals</th>
    </tr>
  </thead>
  <tbody id="tbody">
    <tr><td colspan="5" class="empty">Loading…</td></tr>
  </tbody>
</table>

<dialog id="createModal">
  <form method="dialog" class="modal-wrap" id="createForm">
    <h2>New Competitor</h2>
    <div class="field"><label>Name *</label>
      <input name="name" required></div>
    <div class="field"><label>Aliases (comma-separated)</label>
      <input name="aliases" placeholder="K+N, KN"></div>
    <div class="row2">
      <div class="field"><label>Country</label><input name="country"></div>
      <div class="field"><label>City</label><input name="city"></div>
    </div>
    <div class="field"><label>Website</label><input name="website"></div>
    <div class="field"><label>Services (comma-separated)</label>
      <input name="services" placeholder="Freight Forwarding, Warehousing"></div>
    <div class="field"><label>Verticals (comma-separated)</label>
      <input name="verticals"></div>
    <div class="field"><label>LinkedIn URL</label><input name="linkedin_url"></div>
    <div class="field"><label>Strategic Notes</label>
      <textarea name="strategic_notes" rows="2"></textarea></div>
    <div class="actions">
      <button type="button" class="btn" onclick="closeCreate()">Cancel</button>
      <button type="button" class="btn primary" onclick="submitCreate()">Create</button>
    </div>
  </form>
</dialog>

<script>
const CSRF_TOKEN = (document.cookie.match(/(?:^|;\s*)csrf_token=([^;]+)/) || [])[1] || '';
async function jfetch(url, opts) {
  opts = opts || {};
  opts.headers = Object.assign({'Content-Type':'application/json',
                                'X-CSRFToken': CSRF_TOKEN}, opts.headers || {});
  const r = await fetch(url, opts);
  return r.json();
}
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
let ROWS = [];
async function loadRows(){
  const q = (document.getElementById('fSearch').value || '').trim();
  const j = await jfetch('{{ url_prefix }}/api/competitors' + (q ? ('?q=' + encodeURIComponent(q)) : ''));
  ROWS = (j && j.items) || [];
  renderTable();
}
function renderTable(){
  const tbody = document.getElementById('tbody');
  if (!ROWS.length){
    tbody.innerHTML = '<tr><td colspan="5" class="empty">No competitors yet.</td></tr>';
    return;
  }
  tbody.innerHTML = ROWS.map(r => `
    <tr onclick="location='/competitors/${r.id}'">
      <td><b>${escapeHtml(r.name)}</b>${r.aliases && r.aliases.length ? '<div style="font-size:11px;color:var(--text-2)">'+r.aliases.map(escapeHtml).join(', ')+'</div>' : ''}</td>
      <td>${escapeHtml(r.country||'')}</td>
      <td>${escapeHtml(r.city||'')}</td>
      <td>${(r.services||[]).map(escapeHtml).join(', ')}</td>
      <td>${(r.verticals||[]).map(escapeHtml).join(', ')}</td>
    </tr>`).join('');
}
function openCreate(){document.getElementById('createModal').showModal();}
function closeCreate(){document.getElementById('createModal').close();}
async function submitCreate(){
  const f = document.getElementById('createForm');
  const fd = new FormData(f);
  const payload = {};
  fd.forEach((v,k)=>{if(v!==''&&v!=null) payload[k]=v;});
  ['aliases','services','verticals'].forEach(k=>{
    if (payload[k]) payload[k] = payload[k].split(',').map(s=>s.trim()).filter(Boolean);
  });
  const j = await jfetch('{{ url_prefix }}/api/competitors',{method:'POST',body:JSON.stringify(payload)});
  if (j && j.item){
    closeCreate();
    location = '/competitors/' + j.item.id;
  } else {
    alert((j && j.error) || 'Create failed');
  }
}
document.getElementById('fSearch').addEventListener('input', () => {
  clearTimeout(window._t); window._t = setTimeout(loadRows, 250);
});
loadRows();
</script>
</div><!-- /crm-wrap -->
</body>
</html>
