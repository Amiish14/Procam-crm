<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Project Intelligence Funnel — Procam CRM</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_prefix }}/static/css/crm.css">
</head>
<body>
{% include "_crm_topbar.html" %}
<div class="crm-wrap">

<div class="hero">
  <div><h1>Project Intelligence Funnel</h1>
    <div style="color:var(--text-2);font-size:13px;margin-top:4px">
      Project Identified → RFQ → Won → TMS Project. Click any stage to drill in.
    </div>
  </div>
  <div>
    <div class="toggle">
      <button id="tCount" class="active" onclick="setMode('count')">By Count</button>
      <button id="tValue" onclick="setMode('value')">By Value</button>
    </div>
    <a class="btn" href="{{ url_prefix }}/funnels/account-development" style="margin-left:8px">Account Funnel →</a>
  </div>
</div>

<div class="filters">
  <div class="field"><label>PIC</label><input id="fPic"></div>
  <div class="field"><label>Vertical</label><input id="fVert"></div>
  <div class="field"><label>Industry</label><input id="fInd"></div>
  <div class="field"><label>Country</label><input id="fCtry"></div>
  <div class="field"><label>State</label><input id="fState"></div>
  <div class="field"><label>Branch</label><input id="fBranch"></div>
  <div class="field"><label>Project</label><input id="fProj"></div>
  <div class="field"><label>FY</label><input id="fFy" placeholder="2025"></div>
  <div class="field"><label>From</label><input id="fFrom" type="date"></div>
  <div class="field"><label>To</label><input id="fTo" type="date"></div>
  <button class="btn primary" onclick="loadData()">Apply</button>
</div>

<div class="grid2">
  <div class="card">
    <h3>Funnel</h3>
    <svg class="funnel-svg" id="funnel" viewBox="0 0 600 520"></svg>
  </div>
  <div class="card">
    <h3>Stage detail</h3>
    <table id="tbl"><thead><tr>
      <th>Stage</th><th>Count</th><th>Value (₹)</th><th>Avg Days</th>
      <th>Ageing</th><th>Conv %</th>
    </tr></thead><tbody></tbody></table>
  </div>
</div>

<script>
const CSRF_TOKEN = (document.cookie.match(/(?:^|;\s*)csrf_token=([^;]+)/) || [])[1] || '';
async function jfetch(url){
  const r = await fetch(url, {headers:{'X-CSRFToken':CSRF_TOKEN}});
  return r.json();
}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtINR(n){if(!n) return '—';if(n>1e7) return '₹'+(n/1e7).toFixed(2)+' Cr';if(n>1e5) return '₹'+(n/1e5).toFixed(1)+' L';return '₹'+Math.round(n).toLocaleString();}

let MODE = 'count';
let STAGES = [];
function setMode(m){
  MODE = m;
  document.getElementById('tCount').classList.toggle('active', m==='count');
  document.getElementById('tValue').classList.toggle('active', m==='value');
  drawFunnel();
}
/* One place that reads the filter inputs, so a drill-through can
   never apply different filters than the chart above it. */
function filterQuery(){
  const q = new URLSearchParams();
  const add = (k, id) => {const el = document.getElementById(id);
    const v = el ? el.value.trim() : ''; if (v) q.set(k, v);};
  add('pic','fPic');
  add('vertical','fVert');
  add('industry','fInd');
  add('country','fCtry');
  add('state','fState');
  add('branch','fBranch');
  add('project','fProj');
  add('financial_year','fFy');
  add('date_from','fFrom');
  add('date_to','fTo');
  return q;
}

async function loadData(){
  const q = filterQuery();
  const j = await jfetch('{{ url_prefix }}/api/funnel/project-intelligence?' + q.toString());
  STAGES = j.stages || [];
  drawFunnel();
  drawTable();
}
function drawFunnel(){
  const svg = document.getElementById('funnel');
  svg.innerHTML = '';
  const n = STAGES.length;
  const rowH = 500 / n;
  const maxVal = Math.max(1, ...STAGES.map(s => MODE==='count'?s.count:s.value));
  STAGES.forEach((s, i) => {
    const v = MODE==='count'?s.count:s.value;
    const wPct = 0.15 + 0.85 * (v / maxVal);
    const w = 560 * wPct;
    const x = (600 - w) / 2;
    const y = 10 + i * rowH;
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('class','stage');
    g.setAttribute('onclick', `drill('${String(s.stage).replace(/'/g, "\\'")}')`);
    g.setAttribute('style', 'cursor:pointer');
    const rect = document.createElementNS('http://www.w3.org/2000/svg','rect');
    rect.setAttribute('x', x); rect.setAttribute('y', y);
    rect.setAttribute('width', w); rect.setAttribute('height', rowH - 4);
    rect.setAttribute('fill', '#0B0D12');
    rect.setAttribute('opacity', 0.55 + 0.05 * i);
    rect.setAttribute('rx', 4);
    g.appendChild(rect);
    const t1 = document.createElementNS('http://www.w3.org/2000/svg','text');
    t1.setAttribute('x', 300); t1.setAttribute('y', y + rowH/2 - 2);
    t1.setAttribute('text-anchor','middle');
    t1.setAttribute('class','stage-label');
    t1.textContent = s.stage;
    g.appendChild(t1);
    const t2 = document.createElementNS('http://www.w3.org/2000/svg','text');
    t2.setAttribute('x', 300); t2.setAttribute('y', y + rowH/2 + 12);
    t2.setAttribute('text-anchor','middle');
    t2.setAttribute('class','stage-val');
    t2.textContent = MODE==='count' ? (s.count + ' records') : fmtINR(s.value);
    g.appendChild(t2);
    svg.appendChild(g);
  });
}
function drawTable(){
  const tbody = document.querySelector('#tbl tbody');
  tbody.innerHTML = STAGES.map(s => `
    <tr style="cursor:pointer" title="Show the records behind this stage"
        onclick="drill('${String(s.stage).replace(/'/g, "\\'")}')">
      <td><b>${esc(s.stage)}</b></td>
      <td>${s.count}</td>
      <td>${fmtINR(s.value)}</td>
      <td>${s.avg_duration_days==null?'—':s.avg_duration_days}</td>
      <td>${esc(s.ageing_bucket)}</td>
      <td>${s.conversion_pct_to_next==null?'—':(s.conversion_pct_to_next+'%')}</td>
    </tr>`).join('');
}

/* Clicking a stage lists the records behind the number, using the same
   filters the chart used so the two always agree. */
async function drill(stage){
  const card = document.getElementById('drillCard');
  const body = document.getElementById('drillBody');
  document.getElementById('drillTtl').textContent = stage;
  card.style.display = '';
  body.innerHTML = '<div class="panel"><span class="spinner"></span> Loading…</div>';
  card.scrollIntoView({behavior:'smooth', block:'nearest'});

  const p = new URLSearchParams(filterQuery());
  p.set('stage', stage);
  const r = await fetch('{{ url_prefix }}/api/funnel/project-intelligence/records?' + p.toString(),
                        {credentials:'same-origin'});
  const d = await r.json();
  if(!d.ok){
    body.innerHTML = '<div class="panel err">' + esc(d.error || 'Could not load') + '</div>';
    return;
  }
  document.getElementById('drillTtl').textContent =
    stage + ' — ' + d.count + ' record' + (d.count === 1 ? '' : 's');
  if(!d.records.length){
    body.innerHTML = '<div class="empty">Nothing at this stage with the '
      + 'current filters.</div>';
    return;
  }
  body.innerHTML = '<div class="table-wrap"><table>'
    + '<thead><tr><th>Name</th><th>Details</th></tr></thead><tbody>'
    + d.records.map(x =>
        `<tr style="cursor:pointer"><td><b><a href="{{ url_prefix }}${x.route}">`
        + `${esc(x.name)}</a></b></td><td class="meta">${esc(x.meta || '—')}</td></tr>`
      ).join('')
    + '</tbody></table></div>'
    + (d.truncated ? '<div class="meta" style="padding:10px 16px">Showing the '
        + 'first 500 — narrow the filters to see the rest.</div>' : '');
}
function closeDrill(){ document.getElementById('drillCard').style.display='none'; }

loadData();
</script>
</div><!-- /crm-wrap -->
</body>
</html>
