<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RFQ {{ rfq.rfq_number }} — Procam CRM</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--red:#C72435;--ink:#0B0D12;--text:#363B47;--text-2:#6B7280;
        --bg:#F7F8FA;--card:#FFF;--border:#E5E7EB;
        --success:#059669;--warning:#B45309;--danger:#B91C1C;--info:#1D4ED8;
        --font:'Barlow','Inter',system-ui,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font);background:var(--bg);color:var(--text);
       font-size:14px;padding:24px 32px 60px}
  a{color:inherit;text-decoration:none}
  h1{font-size:22px;font-weight:700;color:var(--ink)}
  h2{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:12px}
  .btn{display:inline-block;padding:7px 12px;border:1px solid var(--border);
       border-radius:6px;background:var(--card);color:var(--ink);cursor:pointer;
       font-family:var(--font);font-size:13px;font-weight:600}
  .btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  .btn.success{background:var(--success);color:#fff;border-color:var(--success)}
  .btn.tiny{padding:4px 8px;font-size:11px}
  .hero{display:flex;align-items:flex-end;justify-content:space-between;
        margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--border)}
  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;
        padding:20px;margin-bottom:20px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 24px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px 24px}
  .field label{display:block;font-size:11px;text-transform:uppercase;
       letter-spacing:.05em;color:var(--text-2);font-weight:600;margin-bottom:4px}
  .field input,.field textarea,.field select{width:100%;padding:7px 9px;
       border:1px solid var(--border);border-radius:6px;font-family:var(--font);
       font-size:13px;background:#fff}
  table{width:100%;border-collapse:collapse;background:var(--card);
        border:1px solid var(--border);border-radius:8px;overflow:hidden}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--border);
        font-size:12.5px;vertical-align:top}
  th{background:#F9FAFB;font-weight:600;color:var(--text-2);
     text-transform:uppercase;font-size:11px;letter-spacing:.05em}
  tr:last-child td{border-bottom:0}
  .pill{display:inline-block;padding:2px 8px;border-radius:10px;
        font-size:11px;font-weight:600;background:#EEF;color:var(--ink)}
  .pill.completed{background:#D1FAE5;color:#065F46}
  .pill.not-started{background:#F3F4F6;color:#4B5563}
  .pill.requested,.pill.awaiting-response{background:#FEF3C7;color:#92400E}
  .pill.partially-received{background:#DBEAFE;color:#1D4ED8}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap}
  dialog{border:0;border-radius:10px;padding:0;max-width:560px;width:92vw}
  dialog::backdrop{background:rgba(11,13,18,.4)}
  .modal-wrap{padding:22px 26px}
  .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:14px}
</style>
</head>
<body>

<div class="hero">
  <div>
    <div style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-2)">
      RFQ
    </div>
    <h1>{{ rfq.rfq_number }} — <span id="hStatus" class="pill">{{ rfq.status }}</span></h1>
    <div style="color:var(--text-2);font-size:13px;margin-top:6px">{{ rfq.subject }}</div>
  </div>
  <div class="toolbar">
    <a class="btn" href="{{ url_prefix }}/rfqs">← All RFQs</a>
    <button class="btn primary" onclick="advance()">Advance status →</button>
    <button class="btn success" onclick="openAddLine()">+ Add rate line</button>
  </div>
</div>

<div class="card">
  <h2>Header</h2>
  <form id="headerForm">
    <div class="grid3">
      <div class="field"><label>Subject</label>
        <input name="subject" value="{{ rfq.subject or '' }}"></div>
      <div class="field"><label>Currency</label>
        <input name="currency" value="{{ rfq.currency or 'INR' }}"></div>
      <div class="field"><label>Lead Driver (emp_code)</label>
        <input name="lead_driver" value="{{ rfq.lead_driver or '' }}"></div>
      <div class="field"><label>Origin</label>
        <input name="origin" value="{{ rfq.origin or '' }}"></div>
      <div class="field"><label>Destination</label>
        <input name="destination" value="{{ rfq.destination or '' }}"></div>
      <div class="field"><label>Cargo</label>
        <input name="cargo" value="{{ rfq.cargo or '' }}"></div>
      <div class="field"><label>Received Date</label>
        <input type="date" name="received_date" value="{{ rfq.received_date or '' }}"></div>
      <div class="field"><label>Close Date</label>
        <input type="date" name="close_date" value="{{ rfq.close_date or '' }}"></div>
      <div class="field"><label>Quote By</label>
        <input type="date" name="quote_by_date" value="{{ rfq.quote_by_date or '' }}"></div>
    </div>
    <div class="field" style="margin-top:10px"><label>Scope / description</label>
      <textarea name="scope" rows="3">{{ rfq.scope or '' }}</textarea></div>
    <div class="actions">
      <button type="button" class="btn primary" onclick="saveHeader()">Save header</button>
    </div>
  </form>
</div>

<div class="card">
  <h2>Attachments</h2>
  <div id="attList" style="font-size:12.5px;color:var(--text-2)">Loading…</div>
  <div style="margin-top:12px;display:flex;gap:8px;align-items:center">
    <input type="file" id="attFile">
    <button class="btn" onclick="uploadAtt()">Upload</button>
  </div>
</div>

<div class="card">
  <h2>Rate sourcing lines</h2>
  <table>
    <thead>
      <tr>
        <th>#</th><th>Service</th><th>Scope / Cargo</th><th>Owner</th>
        <th>Status</th><th>Rate</th><th>Validity</th><th></th>
      </tr>
    </thead>
    <tbody id="linesBody"><tr><td colspan="8" style="text-align:center;color:var(--text-2)">Loading…</td></tr></tbody>
  </table>
</div>

<!-- Add line modal -->
<dialog id="addLineModal">
  <form method="dialog" class="modal-wrap" id="addLineForm">
    <h2>Add rate sourcing line</h2>
    <div class="field"><label>Service *</label>
      <select name="service" required>
        <option value="">— select —</option>
        <option>Ocean</option><option>Air</option><option>Transport</option>
        <option>Customs</option><option>Warehouse</option><option>Heavy Lift</option>
        <option>Rigging</option><option>Other</option>
      </select></div>
    <div class="field"><label>Sourcing owner (emp_code)</label>
      <input name="sourcing_owner_id"></div>
    <div class="grid2">
      <div class="field"><label>Origin</label><input name="origin"></div>
      <div class="field"><label>Destination</label><input name="destination"></div>
    </div>
    <div class="field"><label>Cargo</label><input name="cargo"></div>
    <div class="field"><label>Required by</label><input type="date" name="required_by"></div>
    <div class="field"><label>Remarks</label><textarea name="remarks"></textarea></div>
    <div class="actions">
      <button type="button" class="btn" onclick="document.getElementById('addLineModal').close()">Cancel</button>
      <button type="button" class="btn primary" onclick="submitLine()">Add</button>
    </div>
  </form>
</dialog>

<!-- Submit rate modal -->
<dialog id="rateModal">
  <form method="dialog" class="modal-wrap" id="rateForm">
    <h2>Submit rate</h2>
    <input type="hidden" name="line_id">
    <div class="grid2">
      <div class="field"><label>Rate amount *</label>
        <input name="rate_amount" type="number" step="0.01" required></div>
      <div class="field"><label>Currency</label>
        <input name="rate_currency" value="INR"></div>
    </div>
    <div class="field"><label>Validity until</label>
      <input name="rate_validity_until" type="date"></div>
    <div class="field"><label>Vendor / source</label><input name="vendor_source"></div>
    <div class="field"><label>Remarks</label><textarea name="remarks"></textarea></div>
    <div class="actions">
      <button type="button" class="btn" onclick="document.getElementById('rateModal').close()">Cancel</button>
      <button type="button" class="btn success" onclick="submitRate()">Submit rate</button>
    </div>
  </form>
</dialog>

<script>
const RFQ_ID = {{ rfq.id }};
const CSRF_TOKEN = (document.cookie.match(/(?:^|;\s*)csrf_token=([^;]+)/) || [])[1] || '';

async function jfetch(url, opts) {
  opts = opts || {};
  opts.headers = Object.assign({'Content-Type':'application/json',
                                'X-CSRFToken': CSRF_TOKEN}, opts.headers || {});
  const r = await fetch(url, opts);
  return r.json();
}
function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function pill(s) {
  const cls = (s || '').toLowerCase().replace(/\s+/g, '-');
  return `<span class="pill ${cls}">${escapeHtml(s || '')}</span>`;
}

async function reload() {
  const j = await jfetch('/api/rfqs/' + RFQ_ID);
  if (!j || !j.ok) return;
  const rfq = j.rfq;
  document.getElementById('hStatus').textContent = rfq.status;

  // Attachments
  const atts = rfq.attachments || [];
  document.getElementById('attList').innerHTML = atts.length
    ? atts.map(a => `<div>• ${escapeHtml(a.filename)} <span style="color:var(--text-2)">— ${a.uploaded_at}</span></div>`).join('')
    : '<em>No attachments yet.</em>';

  // Lines
  const lines = rfq.lines || [];
  const body = document.getElementById('linesBody');
  if (!lines.length) {
    body.innerHTML = '<tr><td colspan="8" style="text-align:center;color:var(--text-2)">No lines yet — click "+ Add rate line".</td></tr>';
  } else {
    body.innerHTML = lines.map((ln, i) => `
      <tr>
        <td>${ln.line_no || (i+1)}</td>
        <td><b>${escapeHtml(ln.service)}</b></td>
        <td>${escapeHtml(ln.scope || ln.cargo || '')}<br>
            <span style="color:var(--text-2);font-size:11px">${escapeHtml(ln.origin || '')} → ${escapeHtml(ln.destination || '')}</span></td>
        <td>${escapeHtml(ln.sourcing_owner_id || '')}</td>
        <td>${pill(ln.status)}</td>
        <td>${ln.rate_amount != null ? Number(ln.rate_amount).toLocaleString() + ' ' + (ln.rate_currency || '') : '—'}</td>
        <td>${ln.rate_validity_until || '—'}</td>
        <td>${ln.status !== 'Completed'
              ? `<button class="btn tiny primary" onclick="openRateModal(${ln.id})">Submit rate</button>` : ''}</td>
      </tr>`).join('');
  }
}

async function saveHeader() {
  const f = document.getElementById('headerForm');
  const fd = new FormData(f);
  const payload = {};
  fd.forEach((v, k) => { payload[k] = v; });
  const j = await jfetch('/api/rfqs/' + RFQ_ID, {method:'PATCH', body: JSON.stringify(payload)});
  if (j && j.ok) { reload(); } else { alert((j && j.error) || 'Save failed'); }
}
async function advance() {
  const j = await jfetch('/api/rfqs/' + RFQ_ID + '/advance', {method:'POST', body:'{}'});
  if (j && j.ok) { reload(); } else { alert((j && j.error) || 'Advance failed'); }
}
async function uploadAtt() {
  const f = document.getElementById('attFile').files[0];
  if (!f) return alert('choose a file');
  const fd = new FormData(); fd.append('file', f);
  const r = await fetch('/api/rfqs/' + RFQ_ID + '/attachments',
                        {method:'POST', headers:{'X-CSRFToken': CSRF_TOKEN}, body: fd});
  const j = await r.json();
  if (j && j.ok) { document.getElementById('attFile').value = ''; reload(); }
  else { alert((j && j.error) || 'Upload failed'); }
}
function openAddLine() { document.getElementById('addLineModal').showModal(); }
async function submitLine() {
  const f = document.getElementById('addLineForm');
  const fd = new FormData(f);
  const p = {};
  fd.forEach((v,k) => { if (v !== '' && v != null) p[k] = v; });
  if (!p.service) return alert('service required');
  const j = await jfetch('/api/rfqs/' + RFQ_ID + '/lines',
                         {method:'POST', body: JSON.stringify(p)});
  if (j && j.ok) { f.reset(); document.getElementById('addLineModal').close(); reload(); }
  else { alert((j && j.error) || 'Failed'); }
}
function openRateModal(line_id) {
  const f = document.getElementById('rateForm');
  f.reset();
  f.line_id.value = line_id;
  document.getElementById('rateModal').showModal();
}
async function submitRate() {
  const f = document.getElementById('rateForm');
  const fd = new FormData(f);
  const line_id = fd.get('line_id');
  const p = {};
  fd.forEach((v,k) => { if (k !== 'line_id' && v !== '' && v != null) p[k] = v; });
  if (!p.rate_amount) return alert('amount required');
  const j = await jfetch(`/api/rfqs/${RFQ_ID}/lines/${line_id}/submit-rate`,
                         {method:'POST', body: JSON.stringify(p)});
  if (j && j.ok) { document.getElementById('rateModal').close(); reload(); }
  else { alert((j && j.error) || 'Failed'); }
}
reload();
</script>
</body>
</html>
