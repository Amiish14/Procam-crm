<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reports — Procam CRM</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--red:#C72435;--ink:#0B0D12;--text:#363B47;--text-2:#6B7280;
        --bg:#F7F8FA;--card:#FFF;--border:#E5E7EB;
        --font:'Barlow','Inter',system-ui,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font);background:var(--bg);color:var(--text);
       font-size:14px;padding:24px 32px 60px;
       display:flex;align-items:center;justify-content:center;min-height:80vh}
  a{color:var(--red);text-decoration:none}
  a:hover{text-decoration:underline}
  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;
        padding:32px 36px;max-width:520px;width:100%}
  .cat{color:var(--text-2);font-size:12px;text-transform:uppercase;
       letter-spacing:.05em;margin-bottom:10px}
  h1{font-size:22px;color:var(--ink);margin-bottom:12px;text-wrap:balance}
  p{line-height:1.6;margin-bottom:14px}
  .actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
  .btn{padding:9px 16px;border:1px solid var(--border);border-radius:6px;
       background:var(--card);color:var(--ink);font-weight:600;font-size:13px;
       display:inline-block}
  .btn.primary{background:var(--red);color:#fff;border-color:var(--red)}
  .btn:hover{text-decoration:none;filter:brightness(.97)}
</style>
</head>
<body>
  <div class="card">
    <div class="cat">Reports</div>
    <h1>This report is for managers</h1>
    <p>Reports cover the whole company — won value, pricing and every
       colleague's workload — so they're limited to admins and vertical heads.</p>
    <p><strong>My Work</strong> shows everything assigned to you, with what's
       due and what's overdue.</p>
    <div class="actions">
      <a class="btn primary" href="{{ url_prefix }}/my-work">Go to My Work</a>
      <a class="btn" href="{{ url_prefix }}/app">Back to CRM</a>
    </div>
  </div>
</body>
</html>
