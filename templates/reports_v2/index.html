<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reports — Procam CRM</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_prefix }}/static/css/crm.css">
</head>
<body>
{% include "_crm_topbar.html" %}
<div class="crm-wrap">
<h1>Reports Hub</h1>

{% for category, items in reports %}
  <h2>{{ category }}</h2>
  <div class="grid">
    {% for endpoint, label in items %}
      <div class="rep">
        <a href="{{ url_for('reports_v2.' + endpoint) }}">{{ label }} →</a>
        <span class="xlsx">
          Export: <a href="{{ url_for('reports_v2.' + endpoint) }}?format=xlsx">.xlsx</a>
        </span>
      </div>
    {% endfor %}
  </div>
{% endfor %}
</div><!-- /crm-wrap -->
</body>
</html>
