{# One look for the four intelligence screens. #}
<style>
  .intel-grid{display:grid;gap:14px}
  .intel-filters{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;
    margin:10px 0}
  .intel-filters label{display:flex;flex-direction:column;font-size:12px;
    color:var(--p-text-2);gap:3px}
  .intel-table{width:100%;border-collapse:collapse}
  .intel-table th,.intel-table td{text-align:left;padding:7px 9px;
    border-bottom:1px solid var(--p-line,#e6e8ec);vertical-align:top;
    font-size:13px}
  .intel-table th{font-size:11px;text-transform:uppercase;
    letter-spacing:.04em;color:var(--p-text-3)}
  .intel-bad{color:var(--p-danger,#b42318)}
  .intel-good{color:var(--p-text-2)}
  .intel-src{font-size:12px;color:var(--p-text-3)}
  .intel-stamp{font-size:11px;color:var(--p-text-3);white-space:nowrap}
  .intel-timeline{list-style:none;padding:0;margin:0}
  .intel-timeline li{border-left:2px solid var(--p-line,#e6e8ec);
    padding:0 0 16px 14px;margin-left:6px;position:relative}
  .intel-timeline li:before{content:'';position:absolute;left:-5px;top:4px;
    width:8px;height:8px;border-radius:50%;background:var(--p-accent,#2f6feb)}
  .intel-empty{padding:18px;color:var(--p-text-2);font-size:13px}
  .intel-status{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:11px}
  .intel-dep{font-size:12px;color:var(--p-text-2);max-width:46ch}
</style>
