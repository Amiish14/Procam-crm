<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
{% include "_csrf_fetch.html" %}
<title>Cockpit — Procam CRM</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_prefix }}/static/css/crm.css">
<style>
  .ck-search { position:relative; margin:14px 0 18px; }
  .ck-search input { width:100%; height:44px; border:1px solid #e5e7eb;
      border-radius:10px; padding:0 14px; font:inherit; font-size:15px; }
  .ck-hits { position:absolute; z-index:40; left:0; right:0; top:48px;
      background:#fff; border:1px solid #e5e7eb; border-radius:10px;
      box-shadow:0 10px 30px rgba(17,24,39,.10); overflow:hidden;
      display:none; }
  .ck-hits.on { display:block; }
  .ck-hit { display:flex; gap:10px; align-items:baseline; padding:9px 13px;
      border-bottom:1px solid #f3f4f6; text-decoration:none; color:inherit; }
  .ck-hit:hover { background:#f9fafb; }
  .ck-kind { font-size:10.5px; text-transform:uppercase; letter-spacing:.05em;
      color:#6b7280; min-width:62px; font-weight:700; }
  .ck-hit b { font-weight:600; }
  .ck-hit span { color:#6b7280; font-size:12.5px; }
  .ck-tiles { display:grid; gap:10px;
      grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); }
  .ck-tile { background:#fff; border:1px solid #e5e7eb; border-radius:10px;
      padding:13px 15px; }
  .ck-tile b { display:block; font-size:25px; font-weight:800;
      font-variant-numeric:tabular-nums; line-height:1.25; }
  .ck-tile span { font-size:12px; color:#6b7280; }
  .ck-map { background:#fff; border:1px solid #e5e7eb; border-radius:10px;
      padding:4px 0; margin-top:16px; }
  .ck-row { display:grid; grid-template-columns:150px 1fr 74px;
      gap:12px; align-items:center; padding:9px 16px;
      border-bottom:1px solid #f3f4f6; }
  .ck-row:last-child { border-bottom:0; }
  .ck-name { font-size:13px; font-weight:600; }
  .ck-name em { display:block; font-style:normal; font-size:11.5px;
      color:#9ca3af; font-weight:400; }
  .ck-bar { display:flex; height:16px; border-radius:4px; overflow:hidden;
      background:#f3f4f6; }
  .ck-bar i { display:block; }
  .ck-green { background:#059669; } .ck-orange { background:#D97706; }
  .ck-red { background:#DC2626; } .ck-grey { background:#D1D5DB; }
  .ck-n { text-align:right; font-variant-numeric:tabular-nums;
      font-size:13px; font-weight:600; }
  .ck-key { display:flex; gap:14px; flex-wrap:wrap; font-size:12px;
      color:#6b7280; margin:10px 2px 0; }
  .ck-key i { display:inline-block; width:10px; height:10px;
      border-radius:2px; margin-right:5px; vertical-align:-1px; }
  .ck-note { font-size:12px; color:#6b7280; margin-top:10px;
      line-height:1.6; }
  .ck-work { display:grid; gap:12px; margin-top:18px;
      grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); }
  .ck-panel { background:#fff; border:1px solid #e5e7eb;
      border-radius:10px; padding:13px 15px; }
  .ck-panel h2 { font-size:13px; margin:0 0 9px; letter-spacing:.01em; }
  .ck-panel h2 span { color:#9ca3af; font-weight:500; }
  .ck-item { display:flex; gap:9px; align-items:baseline;
      padding:6px 0; border-top:1px solid #f3f4f6; font-size:13px; }
  .ck-item:first-of-type { border-top:0; }
  .ck-item b { font-weight:600; flex:1; }
  .ck-item em { font-style:normal; font-size:11.5px; color:#6b7280; }
  .ck-late { color:#DC2626; font-weight:600; }
  .ck-empty { font-size:12.5px; color:#9ca3af; padding:5px 0; }
  .ck-confirm { border:1px solid #059669; background:#fff;
      color:#047857; border-radius:7px; padding:3px 10px;
      font:inherit; font-size:12px; cursor:pointer; }
  .ck-confirm:hover { background:#ECFDF5; }
  .ck-confirm[disabled] { opacity:.5; cursor:default; }
  .ck-strip { display:flex; gap:3px; align-items:center; flex-wrap:wrap; }
  .ck-step { font-size:10.5px; padding:2px 7px; border-radius:999px;
      border:1px solid #e5e7eb; color:#9ca3af; background:#fff; }
  .ck-step.done { background:#F3F4F6; color:#4B5563; }
  .ck-step.current { color:#fff; border-color:transparent; font-weight:700; }
  .ck-step.current.green { background:#059669; }
  .ck-step.current.orange { background:#D97706; }
  .ck-step.current.red { background:#DC2626; }
  .ck-step.current.grey { background:#9CA3AF; }
</style>
</head>
<body>
{% include "_crm_topbar.html" %}
<div class="crm-wrap">
  <div class="hero">
    <div><h1>Cockpit</h1>
      <div class="today">One landing page, one search box, and where the
        work is stuck.</div></div>
  </div>

  <div class="ck-search">
    <input id="q" placeholder="Search leads, accounts and contacts…"
           autocomplete="off" aria-label="Search everything">
    <div class="ck-hits" id="hits"></div>
  </div>

  <div class="ck-tiles" id="tiles"></div>

  <div class="ck-work" id="work"></div>

  <div class="ck-map" id="map"></div>
  <div class="ck-key">
    <span><i class="ck-green"></i>within target</span>
    <span><i class="ck-orange"></i>past target</span>
    <span><i class="ck-red"></i>more than twice the target</span>
    <span><i class="ck-grey"></i>no stage date on record</span>
  </div>
  <div class="ck-note" id="note"></div>
</div>

<script>
/* Named crmUrl, not P: the prefix guard in
   tests/test_url_prefix_links.py reads helper bodies for
   this name, and a helper it cannot see prefixing is a
   page that renders and loads nothing. */
const crmUrl = "{{ url_prefix }}";
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function jget(u){
  const r = await fetch(crmUrl + u, {headers:{'Accept':'application/json'}});
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

/* Search ------------------------------------------------------------ */
let timer = null;
const box = document.getElementById('q');
const hits = document.getElementById('hits');

box.addEventListener('input', () => {
  clearTimeout(timer);
  timer = setTimeout(run, 180);   /* a keystroke is not a query */
});
box.addEventListener('blur', () => setTimeout(() =>
  hits.classList.remove('on'), 150));

async function run(){
  const q = box.value.trim();
  if (q.length < 2){ hits.classList.remove('on'); return; }
  let d;
  try { d = await jget('/api/crm2/search?q=' + encodeURIComponent(q)); }
  catch (e) { return; }
  if (!d.results.length){
    hits.innerHTML = '<div class="ck-hit"><span>Nothing matches “'
      + esc(q) + '”.</span></div>';
  } else {
    hits.innerHTML = d.results.map(r =>
      '<a class="ck-hit" href="' + esc(r.url || '#') + '">'
      + '<span class="ck-kind">' + esc(r.kind) + '</span>'
      + '<b>' + esc(r.title) + '</b>'
      + '<span>' + esc(r.detail) + '</span></a>').join('');
  }
  hits.classList.add('on');
}

/* Cockpit ----------------------------------------------------------- */
function tile(n, label){
  return '<div class="ck-tile"><b>' + n + '</b><span>'
    + esc(label) + '</span></div>';
}

function bar(r){
  const t = r.total || 1;
  const seg = (n, cls) => n ? '<i class="' + cls + '" style="width:'
    + (n * 100 / t).toFixed(2) + '%"></i>' : '';
  return '<div class="ck-bar">' + seg(r.green, 'ck-green')
    + seg(r.orange, 'ck-orange') + seg(r.red, 'ck-red')
    + seg(r.grey, 'ck-grey') + '</div>';
}

/* My work ----------------------------------------------------------- */
function panel(title, total, rows, render){
  const more = total > rows.length
    ? ' <span>' + rows.length + ' of ' + total + '</span>'
    : (total ? ' <span>' + total + '</span>' : '');
  const body = rows.length
    ? rows.map(render).join('')
    : '<div class="ck-empty">Nothing here.</div>';
  return '<div class="ck-panel"><h2>' + esc(title) + more + '</h2>'
    + body + '</div>';
}

function leadRow(i){
  return '<div class="ck-item"><b>' + esc(i.title) + '</b>'
    + '<em>' + esc(i.stage || '') + '</em></div>';
}

function lateRow(i){
  return '<div class="ck-item"><b>' + esc(i.title) + '</b>'
    + '<em class="ck-late">' + esc(i.due || i.next_action_date || '')
    + '</em></div>';
}

function taskRow(t){
  return '<div class="ck-item"><b>' + esc(t.title) + '</b>'
    + '<em' + (t.overdue ? ' class="ck-late"' : '') + '>'
    + esc(t.why || t.task_key) + '</em></div>';
}

function confirmRow(i){
  const n = i.value_inr == null ? ''
    : Number(i.value_inr).toLocaleString('en-IN');
  return '<div class="ck-item" data-lead="' + i.id + '">'
    + '<b>' + esc(i.title) + '</b><em>' + n + '</em>'
    + '<button class="ck-confirm" data-confirm="' + i.id
    + '">Confirm</button></div>';
}

async function drawWork(){
  let d;
  try { d = await jget('/api/crm2/my-work'); } catch (e) { return; }
  const w = d.work;
  document.getElementById('work').innerHTML =
      panel('My next action', w.next_action_total, w.next_action, leadRow)
    + panel('Overdue leads', w.overdue_leads_total, w.overdue_leads,
            lateRow)
    + panel('Overdue tasks', w.overdue_tasks_total, w.overdue_tasks,
            taskRow)
    + panel('Escalated to me', w.escalated_total, w.escalated, taskRow)
    + panel('Confirm value', w.to_confirm_total, w.to_confirm,
            confirmRow);
}

document.getElementById('work').addEventListener('click', async ev => {
  const btn = ev.target.closest('[data-confirm]');
  if (!btn) return;
  btn.disabled = true;
  btn.textContent = 'Confirming…';
  try {
    const r = await fetch(crmUrl + '/api/crm2/leads/'
      + btn.dataset.confirm + '/confirm-value',
      {method:'POST', credentials:'same-origin',
       headers:{'Content-Type':'application/json'}, body:'{}'});
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'failed');
    btn.closest('.ck-item').remove();
  } catch (e) {
    btn.disabled = false;
    btn.textContent = 'Confirm';
  }
});

(async function(){
  drawWork();
  let d;
  try { d = await jget('/api/crm2/cockpit'); }
  catch (e) {
    document.getElementById('note').textContent =
      'The cockpit could not be loaded.';
    return;
  }
  const c = d.cockpit;
  document.getElementById('tiles').innerHTML =
      tile(c.open_leads, 'open leads')
    + tile(c.needing_attention, 'need attention')
    + tile(c.value_missing, 'no estimated value')
    + tile(c.unowned, 'no owner')
    + tile(c.unlinked, 'no account');

  document.getElementById('map').innerHTML = c.pipeline.map(r =>
    '<div class="ck-row"><div class="ck-name">' + esc(r.stage)
    + '<em>' + (r.oldest ? 'oldest ' + r.oldest + ' days'
                         : 'no ages known') + '</em></div>'
    + bar(r) + '<div class="ck-n">' + r.total + '</div></div>').join('');

  if (c.stage_dates_missing){
    document.getElementById('note').textContent =
      c.stage_dates_missing + ' of ' + c.open_leads + ' open leads have '
      + 'no stage date, so their timing is unknown rather than green. '
      + 'scripts/crm2_backfill_stage_entered.py fills these from the '
      + 'audit trail.';
  }
})();
</script>
</body>
</html>
