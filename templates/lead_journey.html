<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
{% include "_csrf_fetch.html" %}
<title>Lead journey — Procam CRM</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_prefix }}/static/css/crm.css">
</head>
<body class="rfq-page">
{% include "_crm_topbar.html" %}
<div class="rfq-ui">
  <div id="head"></div>
  <div id="next"></div>

  <div class="rfq-ptabs" role="tablist" id="tabs"></div>
  <div class="rfq-pane on" id="pane-journey"></div>
  <div class="rfq-pane" id="pane-steps"></div>
  <div class="rfq-pane" id="pane-activity"></div>
  <div class="rfq-pane" id="pane-conditions"></div>
  <div class="rfq-pane" id="pane-quotes"></div>
  <div class="rfq-pane" id="pane-spend"></div>
  <div class="rfq-pane" id="pane-audit"></div>
</div>

<script src="{{ url_prefix }}/static/js/rfq_ui.js"></script>
<script>
const P = "{{ url_prefix }}";
const LEAD = {{ lead_id|int }};
const esc = RFQ.esc;
let DATA = null, SELECTED = null, TAB = 'journey';

const TABS = [['journey', 'Journey'], ['steps', 'Steps & time'],
              ['activity', 'Activity'], ['conditions', 'Conditions'],
              ['quotes', 'Quotes'], ['spend', 'Spend (IOU)'],
              ['audit', 'Audit']];

async function load() {
  const r = await fetch(P + '/api/journey/' + LEAD);
  if (!r.ok) {
    document.getElementById('head').innerHTML =
      '<p class="rfq-empty">This page is not switched on, or the '
      + 'lead is not one you can see.</p>';
    return;
  }
  DATA = await r.json();
  head(); nextAction(); tabs(); journey(); activity();
  const want = new URLSearchParams(location.search).get('step');
  if (want) selectNode('after', parseInt(want, 10));
}

/* ── header ───────────────────────────────────────────────────── */
function head() {
  const l = DATA.lead, j = DATA.journey;
  const bits = [
    ['Account', l.account || l.company || '—'],
    ['Owner', l.owner || '—'],
    ['Vertical', l.vertical || '—'],
    ['Channel', (l.channel || '—')
      + (l.channel_auto ? ' · automatic' : '')],
  ];
  if (l.expected_rfq_timing) bits.push(['RFQ expected',
    l.expected_rfq_timing]);
  document.getElementById('head').innerHTML = `
    <div class="rfq-ph">
      <h1>Lead #${l.id}</h1>
      ${j.rfq_number
        ? `<span class="rfq-mono">${esc(j.rfq_number)}</span>` : ''}
      ${RFQ.priorityChip(DATA.priority || '')}
      ${RFQ.statusChip(DATA.state || '')}
    </div>
    <div class="rfq-meta">${bits.map(([k, v]) =>
      `<span>${esc(k)} <b>${esc(v)}</b></span>`).join('')}</div>`;
}

/* ── next action ──────────────────────────────────────────────── */
function nextAction() {
  const n = DATA.next_action || {};
  const box = document.getElementById('next');
  if (DATA.state === 'won' || DATA.state === 'lost') {
    // A closed lead has no next action, and a card saying
    // "nothing open" is noise on the one screen that should
    // read as finished.
    box.innerHTML = '';
    return;
  }
  if (!n.step_no) {
    box.innerHTML = `<div class="rfq-action"><div class="ah">
      <h2>Next action</h2><span class="rfq-sub">${
        esc(n.words || 'Nothing is open on this lead.')}</span>
      </div></div>`;
    return;
  }
  const tone = {red: 'rfq-t-red', orange: 'rfq-t-amb',
                green: 'rfq-t-ok', purple: 'rfq-t-hold',
                blue: 'rfq-t-info'}[n.colour] || 'rfq-t-grey';
  const mine = n.can_act;
  box.innerHTML = `<div class="rfq-action">
    <div class="ah">
      <h2>Next action: ${n.step_no}. ${esc(n.title)}</h2>
      <span class="rfq-sub">${esc(n.event || '')}</span>
      <span class="rfq-rag ${tone}">${esc(n.words)}</span>
    </div>
    ${mine ? '' : `<p class="rfq-call info">Waiting on ${
      esc(n.owner_name || n.owner || 'nobody')}. You can see it;
      only they, the vertical head or a director can act.</p>`}
    <div class="rfq-acts">
      <button class="rfq-btn p" type="button"
        onclick="selectNode('after', ${n.step_no})">Open the step</button>
      ${DATA.may_hold ? `<a class="rfq-btn"
        href="${P}/rfqs/chain">Hold / priority on the chain board</a>`
        : ''}
    </div></div>`;
}

/* ── tabs ─────────────────────────────────────────────────────── */
function tabs() {
  document.getElementById('tabs').innerHTML = TABS.map(([k, label]) =>
    `<button type="button" role="tab" data-ptab="${k}"
      class="${TAB === k ? 'on' : ''}">${label}</button>`).join('');
}

function pick(k) {
  TAB = k;
  tabs();
  document.querySelectorAll('.rfq-pane').forEach(p =>
    p.classList.toggle('on', p.id === 'pane-' + k));
  if (k === 'steps') steps();
  if (['conditions', 'quotes', 'audit', 'spend'].includes(k)) {
    loadTab(k);
  }
}

/* ── the flowchart ────────────────────────────────────────────── */
function journey() {
  const j = DATA.journey;
  const before = j.before.map((b, i) =>
    node('before', i, b.title, beforeClass(b), b.sub || ''));
  const after = j.after.map(b =>
    node('after', b.step_no, b.step_no + '. ' + b.title,
         afterClass(b), afterSub(b)));
  let end = '';
  if (DATA.state === 'won') {
    end = `<div class="rfq-nd"><span class="rfq-arr"></span>
      <span class="rfq-box end"><b>Won</b><span>${
        esc(DATA.po || 'PO recorded')}</span></span></div>`;
  } else if (DATA.state === 'lost') {
    end = `<div class="rfq-nd"><span class="rfq-arr"></span>
      <span class="rfq-box lost"><b>Lost</b><span>${
        esc(DATA.lost_reason || '')}</span></span></div>`;
  }
  document.getElementById('pane-journey').innerHTML = `
    <section class="rfq-card rfq-flow">
      <div class="rfq-lane">
        <h3 class="rfq-h3">Before the RFQ ${
          DATA.state === 'pre'
            ? RFQ.chip('in progress', 'rfq-c-brand') : ''}</h3>
        <div class="rfq-nodes">${before.join('')}</div>
      </div>
      <div class="rfq-lane">
        <h3 class="rfq-h3">RFQ to order ${
          DATA.state === 'rfq'
            ? RFQ.chip('in progress', 'rfq-c-brand') : ''}</h3>
        <div class="rfq-nodes">${after.join('')}${end}</div>
      </div>
      <p class="rfq-sub" style="margin:0">Click any box to see who
        did it, when, how long it took and what it needs.</p>
    </section>
    <div id="detail"></div>
    <div id="gantt"></div>`;
  if (SELECTED) showDetail(SELECTED.lane, SELECTED.no);
  chart();
}

function node(lane, no, title, cls, sub) {
  const sel = SELECTED && SELECTED.lane === lane && SELECTED.no === no
    ? ' sel' : '';
  const last = lane === 'after' && no === DATA.journey.after.length;
  const arrow = (lane === 'before' && no < 7) || (lane === 'after'
    && !last) ? '<span class="rfq-arr"></span>' : '';
  return `<div class="rfq-nd">
    <button type="button" class="rfq-box ${cls}${sel}"
      data-lane="${lane}" data-no="${no}">
      <b>${esc(title)}</b><span>${esc(sub)}</span></button>
    ${arrow}</div>`;
}

function beforeClass(b) {
  if (b.state === 'skipped') return 'skip';
  if (b.state === 'done') return 'done';
  if (b.state === 'current') return 'cur g';
  return '';
}

function afterClass(b) {
  if (b.state === 'done') return 'done';
  if (b.state === 'current') {
    return 'cur ' + ({red: 'r', orange: 'o', green: 'g',
                      purple: 'h', blue: 'w'}[b.colour] || 'g');
  }
  return '';
}

function afterSub(b) {
  const who = (b.owner_name || '').split(' ')[0];
  if (b.state === 'done') {
    return (who ? who + ' · ' : '') + RFQ.hours(b.hours);
  }
  if (b.state === 'current') {
    return (who ? who + ' · ' : '') + (b.words || '');
  }
  return who || 'not started';
}

function selectNode(lane, no) {
  SELECTED = {lane: lane, no: no};
  if (TAB !== 'journey') pick('journey'); else journey();
  const box = document.getElementById('detail');
  if (box) box.scrollIntoView({behavior: 'smooth', block: 'nearest'});
}

async function showDetail(lane, no) {
  const box = document.getElementById('detail');
  if (!box) return;
  if (lane === 'before') {
    const b = DATA.journey.before[no];
    box.innerHTML = `<section class="rfq-card">
      <div class="rfq-card-h"><h2>${esc(b.title)}</h2></div>
      <p class="rfq-sub" style="margin:0">${
        esc(b.sub || 'An account-development stage. Logging an '
            + 'activity moves the account along it.')}</p></section>`;
    return;
  }
  const r = await fetch(P + '/api/journey/' + LEAD + '/step/' + no);
  if (!r.ok) {
    const b = DATA.journey.after.find(x => x.step_no === no) || {};
    box.innerHTML = `<section class="rfq-card">
      <div class="rfq-card-h"><h2>${no}. ${esc(b.title || '')}</h2></div>
      <p class="rfq-sub" style="margin:0">Starts when the RFQ mail
        arrives.</p></section>`;
    return;
  }
  const s = (await r.json()).step;
  const meta = [
    ['Responsible', s.owner_name || s.owner || s.responsible || '—'],
    ['Standard', s.standard ? RFQ.hours(s.standard) : 'customer clock'],
  ];
  if (s.started_at) meta.push(['Started', s.started_at]);
  if (s.closed_at) meta.push(['Closed', s.closed_at
    + ' (' + RFQ.hours(s.hours) + ')']);
  if (s.result) meta.push(['Result', s.result]);
  box.innerHTML = `<section class="rfq-card">
    <div class="rfq-card-h"><h2>${s.step_no}. ${esc(s.title)}</h2></div>
    <div class="rfq-meta">${meta.map(([k, v]) =>
      `<span>${esc(k)} <b>${esc(v)}</b></span>`).join('')}</div>
    ${s.reason ? `<p class="rfq-sub" style="margin:6px 0 0">${
      esc(s.reason)}${s.remarks ? ' — ' + esc(s.remarks) : ''}</p>` : ''}
    ${s.held_hours ? `<p class="rfq-sub" style="margin:6px 0 0">${
      RFQ.hours(s.held_hours)} of that was on hold and is not
      counted.</p>` : ''}
    ${s.waiting_for_customer
      ? '<p class="rfq-call info">Waiting for the customer.</p>' : ''}
  </section>`;
}

/* ── time taken at each step ──────────────────────────────────── */
async function chart() {
  const box = document.getElementById('gantt');
  if (!box || !DATA.journey.rfq_id) return;
  const r = await fetch(P + '/api/reports/rfq/'
                        + DATA.journey.rfq_id + '/chart');
  if (!r.ok) {
    box.innerHTML = '<p class="rfq-empty">The time chart needs the '
      + 'reports switched on.</p>';
    return;
  }
  const j = await r.json();
  const bars = j.bars.filter(b => b.start);
  if (!bars.length) { box.innerHTML = ''; return; }
  const t0 = Date.parse(j.from);
  const ends = bars.map(b => Date.parse(b.start) + b.hours * 3600e3);
  const t1 = Math.max.apply(null, ends.concat([Date.now()]));
  const span = Math.max(3600e3, t1 - t0);
  const COLOUR = {red: '--p-danger', orange: '--p-warning',
                  green: '--p-success', blue: '--p-info',
                  purple: '--p-hold', grey: '--p-grey'};
  box.innerHTML = `<section class="rfq-card">
    <div class="rfq-card-h"><h2>Time taken at each step</h2>
      <p>Bar = time held; black mark = standard time.</p></div>
    <div class="rfq-gantt">${bars.map(b => {
      const left = (Date.parse(b.start) - t0) / span * 100;
      const width = Math.max(0.6, b.hours * 3600e3 / span * 100);
      const mark = b.standard
        ? `<i style="left:${Math.min(99.5, left
            + b.standard * 3600e3 / span * 100)}%;width:2px;
            background:var(--p-ink)"></i>` : '';
      return `<button type="button" class="rfq-gr"
        data-lane="after" data-no="${b.step_no}">
        <span>${b.step_no}. ${esc(b.title)}</span>
        <span class="rfq-gt">
          <i style="left:${left}%;width:${Math.min(width,
             100 - left)}%;background:var(${
             COLOUR[b.colour] || '--p-grey'})"></i>${mark}</span>
        <span class="rfq-sub">${RFQ.hours(b.hours)}</span>
      </button>`;
    }).join('')}</div>
    <div class="rfq-legend">
      <span><i style="background:var(--p-success)"></i>On time</span>
      <span><i style="background:var(--p-danger)"></i>Delayed /
        overdue</span>
      <span><i style="background:var(--p-warning)"></i>Running</span>
      <span><i style="background:var(--p-hold)"></i>On hold</span>
    </div></section>`;
}

/* ── steps and time ───────────────────────────────────────────── */
function steps() {
  const box = document.getElementById('pane-steps');
  if (box.dataset.loaded) return;
  const rows = DATA.journey.after;
  if (!DATA.journey.rfq_number) {
    box.innerHTML = '<p class="rfq-empty">Steps start when the RFQ '
      + 'arrives. Before that, see Journey and Activity.</p>';
    return;
  }
  box.dataset.loaded = '1';
  box.innerHTML = `<section class="rfq-card"><div class="rfq-tw">
    <table><thead><tr><th class="n">#</th><th>Step</th>
      <th>Responsible</th><th class="n">Standard</th><th>Closed</th>
      <th class="n">Taken</th><th>Result · reason</th></tr></thead>
    <tbody>${rows.map(b => `<tr class="row" data-lane="after"
      data-no="${b.step_no}">
      <td class="n">${b.step_no}</td><td>${esc(b.title)}</td>
      <td>${esc(b.owner_name || b.owner || '—')}</td>
      <td class="n">${b.standard ? RFQ.hours(b.standard)
        : '<span class="rfq-sub">customer</span>'}</td>
      <td class="rfq-sub">${esc(b.closed_at || '–')}</td>
      <td class="n">${b.hours == null ? '–' : RFQ.hours(b.hours)}</td>
      <td>${result(b)}</td></tr>`).join('')}</tbody></table>
    </div></section>`;
}

function result(b) {
  if (b.state === 'done') {
    const tone = b.result === 'Delayed' ? 'rfq-t-red'
      : b.result === 'Early' ? 'rfq-t-info' : 'rfq-t-ok';
    return b.result
      ? `<b class="${tone}">${esc(b.result)}</b>`
      : '<span class="rfq-sub">Done</span>';
  }
  if (b.state === 'current') {
    const tone = {red: 'rfq-t-red', orange: 'rfq-t-amb',
                  green: 'rfq-t-ok', purple: 'rfq-t-hold',
                  blue: 'rfq-t-info'}[b.colour] || 'rfq-t-grey';
    return `<span class="rfq-rag ${tone}">${esc(b.words)}</span>`;
  }
  return '<span class="rfq-sub">Not started</span>';
}

/* ── the read-only tabs ───────────────────────────────────────── */
async function loadTab(name) {
  const box = document.getElementById('pane-' + name);
  if (box.dataset.loaded) return;
  const r = await fetch(P + '/api/journey/' + LEAD + '/tab/' + name);
  if (!r.ok) {
    box.innerHTML = '<p class="rfq-empty">Not available.</p>';
    return;
  }
  const j = await r.json();
  box.dataset.loaded = '1';
  if (name === 'conditions') return conditions(box, j);
  if (name === 'quotes') return quotes(box, j);
  if (name === 'spend') return spend(box, j);
  return audit(box, j);
}

function conditions(box, j) {
  if (!j.rows.length) {
    box.innerHTML = `<section class="rfq-card">
      <div class="rfq-card-h"><h2>Conditions by department</h2></div>
      <p class="rfq-empty">None yet. Departments add conditions
        while closing their RFQ steps.</p></section>`;
    return;
  }
  box.innerHTML = `<section class="rfq-card">
    <div class="rfq-card-h"><h2>Conditions by department</h2>
      <p>Internal notes never reach the customer.</p></div>
    <div class="rfq-tw"><table><thead><tr><th>Step</th><th>By</th>
      <th>Type</th><th>Text</th><th>Visibility</th></tr></thead>
    <tbody>${j.rows.map(c => `<tr>
      <td class="rfq-sub">${c.step_no}. ${esc(c.step_title)}</td>
      <td>${esc(c.by_name || '—')}</td><td>${esc(c.type)}</td>
      <td>${esc(c.text)}</td>
      <td>${c.customer_facing
        ? RFQ.chip('Customer-facing', 'rfq-c-ok')
        : RFQ.chip('Internal', 'rfq-c-brand')}</td></tr>`).join('')}
    </tbody></table></div>
    <h3 class="rfq-h3" style="margin:14px 0 6px">Goes on the
      quotation</h3>
    ${j.consolidated.length
      ? `<ul class="rfq-list">${j.consolidated.map(c =>
          `<li>${esc(c.text)}${c.duplicates
            ? ' <span class="rfq-sub">(duplicate merged)</span>'
            : ''}</li>`).join('')}</ul>`
      : '<p class="rfq-empty">Nothing customer-facing yet.</p>'}
    </section>`;
}

function quotes(box, j) {
  if (!j.rows.length) {
    box.innerHTML = `<section class="rfq-card">
      <div class="rfq-card-h"><h2>Quotation versions</h2></div>
      <p class="rfq-empty">The quotation is created when the cost
        sheet is saved.</p></section>`;
    return;
  }
  const tone = s => s === 'Submitted' ? 'rfq-c-ok'
    : s === 'Draft' ? 'rfq-c-amb'
    : s === 'Approved' ? 'rfq-c-info' : '';
  box.innerHTML = `<section class="rfq-card">
    <div class="rfq-card-h"><h2>Quotation versions</h2>
      <p>Revisions keep the first quote's number.</p></div>
    <div class="rfq-tw"><table><thead><tr><th>Quotation</th>
      <th class="n">Value</th><th class="n">Margin</th><th>Reason</th>
      <th>Approved</th><th>Status</th><th>Sent</th><th></th>
      </tr></thead><tbody>${j.rows.map(q => `<tr>
      <td class="rfq-mono">${esc(q.number)}</td>
      <td class="n">${esc(q.money || q.amount)}</td>
      <td class="n">${q.margin == null ? '–' : q.margin + '%'}</td>
      <td class="rfq-sub">${esc(q.reason || '–')}</td>
      <td class="rfq-sub">${q.approved_by
        ? esc(q.approved_by) + ', ' + esc(q.approved_at) : 'Pending'}</td>
      <td>${RFQ.chip(q.status, tone(q.status))}</td>
      <td class="rfq-sub">${q.sent_at
        ? esc(q.sent_at) + '<br>' + esc(q.sent_by) : '–'}</td>
      <td><a class="rfq-btn s" href="${P}${esc(q.pdf)}"
        target="_blank" rel="noopener">PDF</a></td>
      </tr>`).join('')}</tbody></table></div></section>`;
}

function spend(box, j) {
  box.innerHTML = `<section class="rfq-card">
    <div class="rfq-card-h"><h2>Sales spend on this lead</h2>
      <p>IOUs are raised, approved, paid and settled in the TMS IOU
        module with this lead no. (#${LEAD}). Read-only here.</p></div>
    <div class="rfq-tw"><table><thead><tr><th>IOU</th>
      <th>Raised by</th><th>Purpose</th><th class="n">Amount</th>
      <th>Status</th><th>Settle by</th></tr></thead>
      <tbody><tr><td colspan="6" class="rfq-sub">${esc(j.missing)} ·
        <a class="rfq-lnk" href="${P}/admin/crm-rules">what the
        pilot still needs</a></td></tr></tbody></table></div>
    <div class="rfq-action" style="margin-top:12px">
      <div class="ah"><h2>Raise IOU in the TMS for lead #${LEAD}</h2>
        <span class="rfq-sub">The TMS IOU form opens with the lead
          number filled in; sanction and payment follow the TMS
          rules.</span></div>
      <div class="rfq-acts"><a class="rfq-btn p" id="iou"
        href="${esc(j.form)}" target="_blank" rel="noopener">Open TMS
        IOU form</a></div></div></section>`;
}

function audit(box, j) {
  if (!j.rows.length) {
    box.innerHTML = '<p class="rfq-empty">Nothing recorded yet.</p>';
    return;
  }
  box.innerHTML = `<section class="rfq-card"><div class="rfq-tw">
    <table><thead><tr><th>When</th><th>User</th><th>Action</th>
      <th>Remarks</th></tr></thead><tbody>${j.rows.map(a => `<tr>
      <td class="rfq-sub">${esc(a.at)}</td>
      <td>${esc(a.actor)}</td><td>${esc(a.action)}</td>
      <td class="rfq-sub">${esc(a.reason)}</td></tr>`).join('')}
    </tbody></table></div></section>`;
}

/* ── activity ─────────────────────────────────────────────────── */
function activity() {
  document.getElementById('pane-activity').innerHTML = `
    <section class="rfq-card">
      <div class="rfq-card-h"><h2>Activity</h2>
        <p>Logging an activity moves the lead along the funnel —
          there is no separate stage change.</p></div>
      <form class="rfq-form" onsubmit="return logIt(event)">
        <div class="rfq-frow">
          <div class="rfq-fld"><label for="kind">What happened</label>
            <select id="kind" onchange="conditional()">
              <option value="">Choose…</option>
              ${DATA.kinds.map(k =>
                `<option>${esc(k)}</option>`).join('')}
            </select></div>
          <div class="rfq-fld" id="cond"></div>
          <div class="rfq-fld"><label for="note">Note
            (optional)</label><input id="note" placeholder="One line">
          </div>
        </div>
        <div class="rfq-acts">
          <button class="rfq-btn p" type="submit">Save activity</button>
        </div>
        <p class="rfq-err" id="msg" hidden></p>
      </form></section>`;
}

function conditional() {
  const field = DATA.asks[document.getElementById('kind').value];
  const box = document.getElementById('cond');
  if (!field) { box.innerHTML = ''; return; }
  if (field === 'rfq_expected_date') {
    box.innerHTML = '<label for="value">RFQ expected date</label>'
      + '<input type="date" id="value">';
    return;
  }
  const options = DATA.lists[field] || [];
  box.innerHTML = `<label for="value">${field === 'capability_fit'
    ? 'Can Procam do it?' : 'RFQ expected'}</label>
    <select id="value"><option value="">Choose…</option>
    ${options.map(o => `<option>${esc(o)}</option>`).join('')}</select>`;
}

async function logIt(ev) {
  ev.preventDefault();
  const msg = document.getElementById('msg');
  const value = document.getElementById('value');
  const r = await fetch(P + '/api/journey/' + LEAD + '/activity', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      kind: document.getElementById('kind').value,
      note: document.getElementById('note').value,
      value: value ? value.value : null})});
  const j = await r.json();
  msg.hidden = false;
  if (!j.ok) { msg.className = 'rfq-err'; msg.textContent = j.error;
               return false; }
  msg.className = 'rfq-sub';
  msg.textContent = j.moved_to
    ? 'Logged. The account has moved to ' + j.moved_to + '.'
    : 'Logged.';
  setTimeout(() => location.reload(), 900);
  return false;
}

document.addEventListener('click', e => {
  const tab = e.target.closest('[data-ptab]');
  if (tab) { pick(tab.dataset.ptab); return; }
  const node = e.target.closest('[data-lane]');
  if (node) {
    selectNode(node.dataset.lane, Number(node.dataset.no));
  }
});

load();
</script>
</body>
</html>
