<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Notifications — Procam CRM</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_prefix }}/static/css/crm.css">
</head>
<body>
{% include "_crm_topbar.html" %}
<div class="crm-wrap">

<h1>Notifications</h1>

<div class="toolbar">
  <a href="{{ url_prefix }}/my-work" style="color:#6B7280">← My Work</a>
  <form method="post" action="{{ url_prefix }}/notifications/read-all">
    <button type="submit">Mark all read</button>
  </form>
</div>

{% if rows %}
  {% for n in rows %}
    <a class="row {% if not n.is_read %}unread{% endif %}" href="{{ crm_url(n.action_url or '/notifications') }}">
      <div>
        <div class="title">{{ n.title }}</div>
        {% if n.body %}<div class="body">{{ n.body }}</div>{% endif %}
        <div class="meta">{{ n.kind }} · {{ n.created_at.strftime('%Y-%m-%d %H:%M') }}</div>
      </div>
    </a>
  {% endfor %}
{% else %}
  <div class="empty">No notifications yet.</div>
{% endif %}

</div><!-- /crm-wrap -->
</body>
</html>
