const normN=n=>n.toLowerCase().replace(/\b(pvt|private|ltd|limited|llp|inc|co|company|the|india)\b/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/s\b/g,'').replace(/\s+/g,' ').trim();
function sim(a,b){const A=new Set(normN(a).split(' ').filter(Boolean)),B=new Set(normN(b).split(' ').filter(Boolean));if(!A.size||!B.size)return 0;let i=0;A.forEach(x=>{if(B.has(x))i++});return i/Math.max(A.size,B.size)}
const domOf=e=>(e.split('@')[1]||'').toLowerCase();
function cands(it){const out=[],d=domOf(it.from),free=FREE.includes(d),g=(it.sig.match(/GSTIN\s*([0-9A-Z]{15})/)||[])[1];
  ACC.forEach(a=>{let rule=null,ex=false;if(a.learned.includes(it.from.toLowerCase())){rule='learned contact';ex=true}else if(!free&&a.domains.includes(d)){rule='account email domain';ex=true}else if(g&&a.gstin===g){rule='GSTIN';ex=true}else{const s=sim(it.sig.split(/[,·]/)[0],a.name);if(s>=.5)rule=`company name ${Math.round(s*100)}% similar`}if(rule)out.push({a,rule,ex})});
  return out.sort((x,y)=>y.ex-x.ex)}

function autoMatch(it){const c=cands(it);it.c=c;const bl=c.find(x=>x.ex&&x.a.blocked);if(bl){it.st='blocked';it.res=`Blocked client ${bl.a.name} (${bl.a.blocked.reason}). No lead created.`;return}
  const ln=c.find(x=>x.rule==='learned contact');if(ln){linkIt(it,ln.a,'system',ln.rule);return}
  const ex=c.filter(x=>x.ex);if(ex.length===1&&c.length===1&&(ex[0].a.owners[it.v]||ex[0].a.owner)){linkIt(it,ex[0].a,'system',ex[0].rule);return}
  it.st='pending';it.why=!c.length?'No account found — create one':FREE.includes(domOf(it.from))?'Free-mail sender — domain cannot identify the company':c.length>1?`${c.length} possible accounts (likely duplicate)`:'Name match only'}

  const team=teamFor(L),pri='Medium';const steps=STEPS.map((s,i)=>({i,who:team[s.role],status:(i===4&&v==='PF')?'na':'todo',start:null,end:null,paused:0,result:null,reason:null}));
  steps[0].start=at;steps[0].end=at;steps[0].status='done';steps[1].start=at;steps[1].status='active';
  L.rfq={num:null,pri,deadline:at+5*D,received:at,steps,conds:[],quotes:[],hold:null,holds:[],outcome:null,contact:{n:'Sender',e:scope.mail||a.contacts[0]&&a.contacts[0].e||''}};L.no=++SER.lead;
  log(L,at,'leads@ mailbox','RFQ mail received','','','');log(L,NOW,by==='system'?'System':nm(by),'Account linked','',a.name,'Rule: '+rule);log(L,NOW,'System','Owner assigned','',nm(o),or);LEADS.push(L);return L}
function linkIt(it,a,by,rule,newOwner){if(newOwner){a.owners[it.v]=newOwner;if(!a.owner)a.owner=newOwner}if(by!=='system'&&!a.learned.includes(it.from.toLowerCase()))a.learned.push(it.from.toLowerCase());
  const L=newRfqLead(a,it.v,it.subject,it.at,by,rule);L.rfq.contact={n:it.sig,e:it.from};it.st=by==='system'?'auto':'linked';it.lead=L.no;it.res=`${a.name} · owner ${nm(L.owner)} (${L.ownerRule})`}

function pStats(k,L0){const rq=L0.filter(L=>L.rfq&&L.rfq.steps.some(s=>s.who===k&&s.status!=='na'));let done=0,ok=0,early=0,open=0,late=0;rq.forEach(L=>L.rfq.steps.forEach(s=>{if(s.who!==k)return;if(s.status==='done'&&s.result){done++;if(s.result!=='Delayed')ok++;if(s.result==='Early')early++}if(s.status==='active'&&!L.rfq.outcome){open++;if(rag(L.rfq,s).c==='r')late++}}));const by={};PRIS.forEach(p=>by[p]=rq.filter(L=>L.rfq.pri===p).length);return {rfqs:rq.length,by,on:done?ok/done:null,early,open,late}}

function spendCard(L0){const all=L0.flatMap(L=>L.ious.map(o=>({o,L})));const byV={},byP={};all.forEach(({o,L})=>{if(o.status==='Requested'||o.status==='Rejected')return;const a=o.status==='Settled'?o.spent:o.amt;byV[L.v]=(byV[L.v]||0)+a;byP[o.p]=(byP[o.p]||0)+a});

/* journey flowchart */
function tJourney(L){const R=L.rfq,cur=curNode(L);
  const box=(i)=>{let cls='box',sub='';
    if(i<8){if(L.preSkip[i]){cls+=' skip';sub='skipped — RFQ came direct'}else if(R||i<L.pre){cls+=' done';sub=L.preAt[i]?dd(L.preAt[i]):''}else if(i===L.pre){const r=preRag(L);cls+=' cur '+r.c;sub=r.l}else{sub='target '+(PRE[i].t||'–')+'d'}}
    else{const s=R&&R.steps[i-8];if(!s){sub='after RFQ'}else if(s.status==='done'){cls+=' done';sub=(i===8?'by mail':esc(nm(s.who)).split(' ')[0]+' · '+fmt(stepDur(s)))}else if(s.status==='na'){cls+=' skip';sub='not needed'}else if(s.status==='closed'){cls+=' skip';sub='closed'}else if(s.status==='active'){const r=rag(R,s);cls+=' cur '+r.c;sub=esc(nm(s.who)).split(' ')[0]+' · '+r.l}else{sub=esc(nm(s.who)).split(' ')[0]}}
    if(S.sel===i)cls+=' sel';
    return `<button type="button" class="${cls}" data-node="${i}"><b>${i<8?'':i-7+'. '}${nodeName(i)}</b><span>${sub}</span></button>`};
  const lane=(from,to)=>{let h='<div class="nodes">';for(let i=from;i<to;i++)h+=`<div class="nd">${box(i)}${i<to-1?'<span class="arr"></span>':''}</div>`;return h+'</div>'};
  let end='';if(R&&R.outcome==='Won')end=`<div class="nd"><span class="arr"></span><button type="button" class="box end"><b>Won</b><span>PO ${esc(R.po?R.po.no:'')}</span></button></div>`;if(R&&R.outcome==='Lost')end=`<div class="nd"><span class="arr"></span><button type="button" class="box lost"><b>Lost</b><span>${esc(R.lostReason)}</span></button></div>`;
  let h=`<section class="card flow"><div class="lane"><h3>Before the RFQ ${!R?chip('in progress','c-brand'):''}</h3>${lane(0,8)}</div><div class="lane"><h3>RFQ to order ${R&&!R.outcome?chip('in progress','c-brand'):''}</h3>${lane(8,20).replace(/<\/div>$/,end+'</div>')}</div><p class="sub" style="margin:0">Click any box to see who did it, when, how long it took and what it needs.</p></section>`;

}
function nodeDetail(L,i){const R=L.rfq;let b='';

  else{const s=R&&R.steps[i-8];if(!s)b='<p class="sub" style="margin:0">Starts when the RFQ mail arrives.</p>';else{const sla=slaOf(s.i,R.pri);b=`<div class="meta"><span>Responsible <b>${esc(nm(s.who))}</b></span><span>Standard <b>${sla?fmt(sla):s.i===0?'automatic':'customer clock'}</b></span>${s.start?`<span>Started <b>${dt(s.start)}</b></span>`:''}${s.end&&s.status==='done'?`<span>Closed <b>${dt(s.end)}</b> (${fmt(stepDur(s))})</span>`:''}${s.result?`<span>Result <b class="${s.result==='Delayed'?'t-red':s.result==='Early'?'t-info':'t-ok'}">${s.result}</b>${s.reason?' — '+esc(s.reason):''}</span>`:''}</div><p class="sub" style="margin:6px 0 0">${STEPS[s.i].ev}.</p>`}}
  return `<section class="card"><div class="card-h"><h2>${nodeName(i)}</h2></div>${b}</section>`}
function gantt(L){const R=L.rfq,st=R.steps.filter(s=>s.start&&s.i>0);if(!st.length)return '';const t0=R.received,t1=Math.max(NOW,...st.map(s=>s.end||NOW)),span=Math.max(H,t1-t0);
  return `<section class="card"><div class="card-h"><h2>Time taken at each step</h2><p>Bar = time held; black mark = standard time. Grey = waiting before the step started.</p></div><div class="gantt">${st.map(s=>{const sla=slaOf(s.i,R.pri),e=s.end||(R.hold?R.hold.since:NOW),left=(s.start-t0)/span*100,w=Math.max(.6,(e-s.start)/span*100),col=s.status==='active'?(rag(R,s).c==='r'?'--bad':rag(R,s).c==='h'?'--hold':'--warn'):s.result==='Delayed'?'--bad':s.result==='Early'?'--info':'--ok';
    return `<button type="button" class="gr" data-node="${8+s.i}"><span>${s.i+1}. ${STEPS[s.i].s} <span class="sub">${esc(nm(s.who).split(' ')[0])}</span></span><span class="gt"><i style="left:${left}%;width:${Math.min(w,100-left)}%;background:var(${col})"></i>${sla?`<i style="left:${Math.min(99.5,left+sla/span*100)}%;width:2px;background:var(--ink)"></i>`:''}</span><span class="sub">${fmt(e-s.start-(s.paused||0))}</span></button>`}).join('')}</div><div class="legend"><span><i style="background:var(--ok)"></i>On time</span><span><i style="background:var(--info)"></i>Early</span><span><i style="background:var(--bad)"></i>Delayed / overdue</span><span><i style="background:var(--warn)"></i>Running</span></div></section>`}
function tSteps(L){const R=L.rfq;if(!R)return '<p class="empty">Steps start when the RFQ arrives. Before that, see Journey and Activity.</p>';

  if(!R){

  if(i===1){const sug=R.deadline-NOW<2*D?'Critical':R.deadline-NOW<4*D?'High':R.deadline-NOW<7*D?'Medium':'Low';
    body=`<div class="frow"><div class="fld"><label for="na-pri">Priority</label><select id="na-pri">${opts(PRIS,sug)}</select><span class="hint">Suggested from the customer deadline</span></div><div class="fld"><label for="na-dl">Customer deadline</label><input id="na-dl" type="datetime-local" value="${new Date(R.deadline+5.5*H).toISOString().slice(0,16)}"><span class="hint">Read from the RFQ mail</span></div></div><div class="acts"><label class="chk"><input type="checkbox" id="na-tech" checked> Technical evaluation needed</label><label class="chk"><input type="checkbox" id="na-survey" ${L.v==='PF'?'':'checked'}> Site / route survey needed</label></div>`+reasonRow(res,i);btn=`<button class="btn p" type="button" data-act="step">Register RFQ</button>`}
  else if(i===2){body=`<div class="frow"><div class="fld"><label for="na-info">RFQ information</label><select id="na-info">${opts(MISSING)}</select><span class="hint">Choosing "Missing" sends a clarification request to the customer</span></div></div>${s.waiting?`<p class="call warn">Waiting for customer: ${esc(s.waiting)}</p>`:''}`+reasonRow(res,i);btn=`<button class="btn p" type="button" data-act="step">Confirm</button>`}
  else if(i===3||i===4){const lib=CLIB[L.v]||[];body=`<div class="fld"><span class="lab">Conditions from ${i===3?'technical evaluation':'the survey'} — tick what applies</span>${lib.map((c,k)=>`<label class="chk"><input type="checkbox" data-lib="${k}"${k===(i===3?0:1)?' checked':''}> <span><b>${c[0]}:</b> ${esc(c[1])}</span></label>`).join('')}</div><div class="frow"><div class="fld"><label for="na-ctext">Add one more (optional)</label><input id="na-ctext" placeholder="Text"></div><div class="fld"><label for="na-ctype">Type</label><select id="na-ctype">${opts(CTYPES,'Assumption')}</select></div><div class="fld"><label for="na-cvis">Shown to customer?</label><select id="na-cvis"><option value="cust">Customer-facing</option><option value="int">Internal note</option></select></div></div>`+reasonRow(res,i);btn=`<button class="btn p" type="button" data-act="step">Confirm conditions</button>`}
  else if(i===5){const mon=amountFor(L.v,rng(L.no)),cur=mon.cur,buy=Math.round(mon.amt*.82),sell=Math.round(buy/(1-(VERT[L.v].floor+6)/100));
    body=`<div class="frow"><div class="fld"><label for="na-cur">Currency</label><select id="na-cur">${opts(['INR','USD','EUR'],cur)}</select></div><div class="fld"><label for="na-buy">Cost (from rate sourcing)</label><input id="na-buy" inputmode="numeric" value="${buy}"><span class="hint">Lowest of 3 vendor replies on this route</span></div><div class="fld"><label for="na-sell">Quoted price</label><input id="na-sell" inputmode="numeric" value="${sell}"><span class="hint" id="na-mg"></span></div></div>`+reasonRow(res,i);btn=`<button class="btn p" type="button" data-act="step">Save cost sheet</button>`;sub='Saving the cost sheet creates '+(R.qno||'the quote')+' / Rev-00 and closes this step. Margin floor '+VERT[L.v].floorTxt+'.'}
  else if(i===6){const q=last(R),mg=q.buy?Math.round((1-q.buy/q.amount)*100):null;body=`<p class="call ${mg!=null&&mg<VERT[L.v].floor?'':'info'}">${esc(qno(R,q))} · ${fmtM(q.amount,q.cur)} · margin ${mg}% (floor ${VERT[L.v].floor}%)${mg!=null&&mg<VERT[L.v].floor?' — below floor, director approval needed':''}</p><div class="frow"><div class="fld"><label for="na-dec">Decision</label><select id="na-dec">${opts(['Approve','Return to costing — margin too low','Return to costing — scope unclear'])}</select></div></div>`+reasonRow(res,i);btn=`<button class="btn p" type="button" data-act="step">Submit decision</button>`}
  else if(i===7){const q=last(R);body=`<div class="frow"><div class="fld"><label for="na-to">Send to</label><select id="na-to">${opts([R.contact.e].concat(acc(L).contacts.map(c=>c.e)).filter((v,k,a)=>v&&a.indexOf(v)===k))}</select></div><div class="fld"><span class="lab">Copy</span><span class="sub">leads@procamgroup.in (always)</span></div><div class="fld"><span class="lab">Attachment</span><span class="sub">${esc(R.qno)}_${rvs(q)}.pdf · ${fmtM(q.amount,q.cur)}</span></div></div>`+reasonRow(res,i);btn=`<button class="btn p" type="button" data-act="step">Send quotation</button>`}
  else if(i===8){const q=last(R);if(q.status==='Draft'){title='Approve '+rvs(q);sub='Revision waiting for the vertical head.';body=`<p class="call info">${esc(qno(R,q))} · ${fmtM(q.amount,q.cur)} · ${esc(q.reason)}</p>`;btn=`<button class="btn p" type="button" data-act="revapprove">Approve ${rvs(q)}</button>`;return wrap(title,sub,body,btn,VERT[L.v].head)}
    if(q.status==='Approved'){title='Send '+rvs(q);body=`<p class="call info">${esc(qno(R,q))} approved. Sending marks the earlier revision Superseded.</p>`;btn=`<button class="btn p" type="button" data-act="revsend">Send ${rvs(q)}</button>`;return wrap(title,'Revision approved.',body,btn,who)}
    body=`<div class="frow"><div class="fld"><label for="na-resp">Customer response</label><select id="na-resp">${opts(['Revision requested','Accepted — move to final bid','Lost'])}</select></div><div class="fld"><label for="na-ramt">Revised price (if revision)</label><input id="na-ramt" inputmode="numeric" value="${Math.round(q.amount*.96)}"></div><div class="fld"><label for="na-rr">Reason</label><select id="na-rr">${opts(['Customer asked for a revised price','Scope changed','Quantity changed'].concat(LOSTR.map(x=>'Lost: '+x)))}</select></div></div>`;btn=`<button class="btn p" type="button" data-act="step">Record response</button>`}
  else if(i===9){body=`<div class="frow"><div class="fld"><label for="na-aw">Award expected on</label><input id="na-aw" type="date" value="${isoD(NOW+7*D)}"></div></div>`;btn=`<button class="btn p" type="button" data-act="step">Confirm final bid</button>`}
  else if(i===10){body=`<div class="frow"><div class="fld"><label for="na-po">Customer PO / LOI no.</label><input id="na-po" placeholder="e.g. 4500123456"></div><div class="fld"><label for="na-pod">PO date</label><input id="na-pod" type="date" value="${isoD(NOW)}"></div></div>`;btn=`<button class="btn p" type="button" data-act="step">Record PO — Won</button>`}
  else if(i===11){body=`<p class="sub" style="margin:0">Handover pack: account, contact, scope, final quote ${esc(R.qno)}, conditions, PO — filled from this record.</p>`;btn=`<button class="btn p" type="button" data-act="step">Send handover pack</button>`}
  if(res==='Delayed')sub+=' Late — a reason is needed to close.';
  return wrap(title,sub,body,btn,who);
}
function mgmtBtns(L){const m=me(),R=L.rfq;if(!R||R.outcome)return '';const ok=m.role==='admin'||(m.role==='head'&&m.v===L.v);if(!ok)return '';
  return `<span style="flex:1"></span><label class="sub" for="mg-pri">Priority</label><select class="btn" id="mg-pri">${opts(PRIS,R.pri)}</select><button class="btn s" type="button" data-act="setpri">Change</button>${R.hold?`<button class="btn s" type="button" data-act="release">Reactivate</button>`:`<select class="btn" id="mg-hold">${opts(HOLDR)}</select><button class="btn s" type="button" data-act="hold">Put on hold</button>`}`}

const val=id=>{const e=document.getElementById(id);return e?e.value.trim():''};
function findL(no){return LEADS.find(L=>L.no===+no)}
function doLogAct(L){const kind=val('na-kind'),at=new Date(val('na-date')+'T12:00:00+05:30').getTime()||NOW,who=me().k;let note=val('na-note'),to=L.pre;
  const map={'Phone call':2,'Email':2,'LinkedIn message':2,'Meeting planned':3,'Meeting held':4,'Requirement received':5,'Capability check':6,'RFQ expected':7};
  if(kind==='Meeting planned')note=('Meeting on '+dd(new Date(val('na-mdate')).getTime())+' '+note).trim();
  if(kind==='Meeting held'){L.timing=val('na-timing');note=('RFQ expected: '+L.timing+' '+note).trim()}
  if(kind==='Requirement received')note=(val('na-svc')+' '+note).trim();
  if(kind==='Capability check'){const f=val('na-fit');L.fit=f;note=(f+' '+note).trim();if(f.startsWith('No')){L.acts.push({at,by:who,kind,note});L.closed='lost';L.pre=Math.max(L.pre,6);log(L,NOW,nm(who),'Lead closed','Open','Not a fit',f);toast('Lead closed: outside capability. It stays in the funnel report.');return}}
  if(kind==='RFQ expected'){L.rfqDate=new Date(val('na-rdate')).getTime();note=('RFQ expected on '+dd(L.rfqDate)+' '+note).trim()}
  L.acts.push({at,by:who,kind,note});const nt=Math.max(L.pre,map[kind]);if(L.pre<1)L.pre=1;
  if(nt>L.pre){for(let s=L.pre+1;s<=nt;s++)L.preAt[s]=NOW;log(L,NOW,nm(who),'Funnel stage moved',PRE[L.pre].n,PRE[nt].n,'From activity: '+kind);L.pre=nt;toast(`Saved. Lead moved to "${PRE[nt].n}".`)}else toast('Activity saved.')}
function closeStep(L,s,extra){const R=L.rfq,sla=slaOf(s.i,R.pri),res=resOf(sla,elapsed(R,s));const reason=val('na-reason'),rem=val('na-rem');
  if(reason==='Others'&&!rem){S.msg='Remarks are needed when the reason is Others.';return false}
  s.end=NOW;s.status='done';s.result=res;s.reason=(res==='Delayed'||res==='Early')?reason:null;
  log(L,NOW,nm(me().k),'Step closed: '+STEPS[s.i].n,'',res||'Done',[s.reason,rem,extra].filter(Boolean).join(' — '));
  let nx=s.i+1;while(nx<12&&R.steps[nx].status==='na')nx++;
  if(nx<12){const n=R.steps[nx];n.start=NOW;n.end=null;n.status='active';log(L,NOW,'System','Passed to '+nm(n.who),'',STEPS[nx].n,'')}
  return true}
function doStep(L){const R=L.rfq,s=active(R),i=s.i,who=nm(me().k);S.msg=null;
  if(i===1){const p=val('na-pri');R.pri=p;R.deadline=new Date(val('na-dl')+':00+05:30').getTime()||R.deadline;if(!document.getElementById('na-tech').checked)R.steps[3].status='na';if(!document.getElementById('na-survey').checked)R.steps[4].status='na';R.num='RFQ-2026-'+String(++SER.rfq).padStart(4,'0');if(!closeStep(L,s))return;log(L,NOW,who,'RFQ registered','',R.num+' · '+p,'');toast(`${R.num} registered as ${p}. Sent to ${nm(R.steps.find(x=>x.status==='active').who)}.`);return}
  if(i===2){const inf=val('na-info');if(inf.startsWith('Missing')){s.waiting=inf.replace('Missing: ','');log(L,NOW,who,'Clarification asked from customer','',s.waiting,'Mail sent from the CRM');toast('Clarification mail sent to the customer. Close this step once they reply.');return}if(!closeStep(L,s))return;toast('Screening confirmed.');return}
  if(i===3||i===4){const lib=CLIB[L.v]||[];document.querySelectorAll('[data-lib]').forEach(c=>{if(c.checked){const x=lib[+c.dataset.lib];R.conds.push({step:i,by:s.who,type:x[0],text:x[1],vis:'cust'})}});const t=val('na-ctext');if(t)R.conds.push({step:i,by:s.who,type:val('na-ctype'),text:t,vis:val('na-cvis')});if(!closeStep(L,s,'conditions confirmed'))return;toast('Conditions saved and step closed.');return}
  if(i===5){const buy=+val('na-buy'),sell=+val('na-sell'),cur=val('na-cur');if(!(sell>0)||!(buy>0)){S.msg='Cost and quoted price are both needed.';return}if(!R.qno)R.qno='QUO-2026-'+String(++SER.quo).padStart(4,'0');const x=R.quotes.length?last(R):null;R.quotes.push({rev:x?x.rev+1:0,amount:sell,buy,cur,at:NOW,reason:x?'Re-costed after return':'Initial offer',status:'Draft',by:s.who});if(!closeStep(L,s))return;log(L,NOW,who,'Cost sheet saved','',fmtM(sell,cur),'Margin '+Math.round((1-buy/sell)*100)+'%');toast(`${qno(R,last(R))} created and sent for approval.`);return}
  if(i===6){const d=val('na-dec'),q=last(R);if(d!=='Approve'){q.status='Superseded';log(L,NOW,who,'Returned to costing','',d,'');s.end=null;s.status='todo';s.start=null;s.result=null;const c=R.steps[5];c.status='active';c.start=NOW;c.end=null;c.result=null;toast('Returned to costing.');return}q.status='Approved';q.appBy=me().k;q.appAt=NOW;if(!closeStep(L,s))return;toast(`${qno(R,q)} approved.`);return}
  if(i===7){const q=last(R);Object.assign(q,{status:'Submitted',sentAt:NOW,sentBy:me().k,sentTo:val('na-to'),via:'Sent from CRM',ref:'MSG-'+(100000+NOW%900000)});if(!closeStep(L,s))return;toast(`${qno(R,q)} sent. leads@ copied; step closed.`);return}
  if(i===8){const r=val('na-resp');if(r==='Lost'){const rs=val('na-rr').replace('Lost: ','');R.outcome='Lost';R.lostReason=LOSTR.includes(rs)?rs:LOSTR[0];s.end=NOW;s.status='closed';log(L,NOW,who,'Lead closed as Lost','Open','Lost',R.lostReason);toast('Closed as Lost.');return}
    if(r.startsWith('Accepted')){if(!closeStep(L,s))return;toast('Moved to final bid.');return}
    const o=last(R),amt=+val('na-ramt');if(!(amt>0)){S.msg='Enter the revised price.';return}const n={rev:o.rev+1,amount:amt,buy:o.buy,cur:o.cur,at:NOW,reason:val('na-rr').replace('Lost: ',''),status:'Draft',by:me().k};R.quotes.push(n);log(L,NOW,who,'Revision created '+qno(R,n),fmtM(o.amount,o.cur),fmtM(amt,o.cur),n.reason);toast(`${qno(R,n)} created — waiting for ${nm(VERT[L.v].head)} to approve.`);return}

  if(i===11){if(!closeStep(L,s))return;R.outcome='Won';log(L,NOW,who,'Won — handover pack sent','','Won','');toast('Handover pack sent. Lead won.');return}
}

const PAGES=[['cockpit','Cockpit'],['mywork','My Work'],['leads','Leads'],['accounts','Accounts'],['rfqs','RFQs'],['quotes','Quotes'],['funnels','Funnels'],['reports','Reports'],['changes','What changes']];

function search(){const h=document.getElementById('hits'),q=S.q.trim().toLowerCase();if(q.length<2){h.hidden=true;return}

function doIou(kind,L,no){const o=L.ious.find(x=>x.no===no),who=me().k;
  if(kind==='approve'){o.status='Approved';o.appAt=NOW;log(L,NOW,nm(who),'IOU approved '+no,'Requested','Approved','');toast(no+' approved. Accounts will pay it.')}
  if(kind==='reject'){o.status='Rejected';log(L,NOW,nm(who),'IOU rejected '+no,'Requested','Rejected','');toast(no+' rejected.')}
  if(kind==='pay'){o.status='Paid';o.paidAt=NOW;log(L,NOW,nm(who),'IOU paid '+no,'Approved','Paid','');toast(no+' paid. Settle-by date '+dd(o.settleBy)+'.')}
  if(kind==='settle'){o.status='Settled';o.spent=Math.round(o.amt*.95);o.setAt=NOW;log(L,NOW,nm(who),'IOU settled '+no,'Paid','Settled','Spent '+fmtI(o.spent)+'; balance '+fmtI(o.amt-o.spent)+' returned');toast(no+' settled with bills. Balance returned.')}
  render()}
function act(a,id,t){const L=S.open&&findL(S.open),m=me();
  if(a==='close'){S.open=null;render();return}
  if(a==='pdf'){S.pdf=!S.pdf;render();return}
  if(a==='clearf'){S.f={v:'',owner:'',node:'',st:'open',person:''};render();return}
  if(a==='logact'){S.msg=null;doLogAct(L);render();return}
  if(a==='step'){doStep(L);render();return}
  if(a==='rfqarrive'){const R=newRfqLead(acc(L),L.v,L.scope,NOW,'system','account email domain');LEADS.splice(LEADS.indexOf(R),1);L.rfq=R.rfq;L.rfq.contact=acc(L).contacts[0];L.acts.push({at:NOW,by:'leads@',kind:'RFQ received',note:'Mail to leads@ — linked by account domain'});log(L,NOW,'leads@ mailbox','RFQ mail received','RFQ expected','RFQ received','Sent to RFQ Coordinator for registration');SER.lead--;toast('RFQ mail linked to this lead. Waiting for the RFQ Coordinator to register it.');render();return}
  if(a==='revapprove'){const q=last(L.rfq);q.status='Approved';q.appBy=m.k;q.appAt=NOW;log(L,NOW,m.n,'Quotation approved ('+rvs(q)+')','Draft','Approved','');toast(qno(L.rfq,q)+' approved.');render();return}
  if(a==='revsend'){const R=L.rfq,q=last(R);R.quotes.forEach(z=>{if(z!==q&&z.status==='Submitted')z.status='Superseded'});const prev=R.quotes.filter(z=>z.sentTo).pop();Object.assign(q,{status:'Submitted',sentAt:NOW,sentBy:m.k,sentTo:(prev&&prev.sentTo)||R.contact.e,via:'Sent from CRM'});log(L,NOW,m.n,'Quotation sent ('+rvs(q)+')','Approved','Submitted','leads@ copied');toast(qno(R,q)+' sent.');render();return}
  if(a==='setpri'){const p=val('mg-pri');if(p!==L.rfq.pri){log(L,NOW,m.n,'Priority changed (management)',L.rfq.pri,p,'');L.rfq.pri=p;toast('Priority now '+p+'. Everyone on this RFQ is told.')}render();return}
  if(a==='hold'){const s=active(L.rfq);L.rfq.hold={since:NOW,by:m.k,reason:val('mg-hold'),remarks:'',step:s.i};log(L,NOW,m.n,'RFQ put on hold','Active','On hold',L.rfq.hold.reason);toast('On hold. Timers paused.');render();return}
  if(a==='release'){const s=active(L.rfq),dur=NOW-L.rfq.hold.since;s.paused=(s.paused||0)+dur;L.rfq.holds.push({...L.rfq.hold,until:NOW});log(L,NOW,m.n,'RFQ reactivated','On hold','Active','Held '+fmt(dur));L.rfq.hold=null;toast('Reactivated. Held time is not counted against anyone.');render();return}
  if(a==='raiseiou'){const amt=+val('iou-a');if(!(amt>0)){S.msg='Enter the IOU amount.';render();return}S.msg=null;const o={no:'IOU-2026-'+String(++SER.iou).padStart(4,'0'),by:m.k,p:val('iou-p'),amt,at:NOW,mode:val('iou-m'),settleBy:new Date(val('iou-s')).getTime(),status:'Requested',app:VERT[L.v].head};L.ious.push(o);log(L,NOW,m.n,'IOU raised '+o.no,'',fmtI(amt),o.p);toast(`TMS IOU form opened with Lead no. #${L.no}. ${o.no} raised there; it shows here once read from the TMS.`);render();return}
  if(a==='acconfirm'){const it=INBOX.find(x=>x.id===id),f=document.querySelector(`[data-acform="${id}"]`),sel=(f.querySelector(`input[name=acc-${id}]:checked`)||{}).value,g=n=>f.querySelector(`[data-n="${n}"]`).value.trim();
    if(sel==='new'){const name=g('name');const bl=ACC.find(x=>x.blocked&&sim(name,x.name)>=.5);if(bl){toast(`"${name}" looks like blocked client ${bl.name}. Not created.`);return}const a2={id:ACC.length+1,name,v:it.v,domains:g('dom')?[g('dom')]:[],gstin:g('gst'),contacts:[{n:'Sender',e:it.from}],learned:[],owners:{},owner:null,blocked:null,created:NOW,by:m.n,wins:0};ACC.push(a2);linkIt(it,a2,m.k,'new account created',g('own'))}
    else{const a2=ACC.find(x=>x.id===+sel),c=it.c.find(x=>x.a.id===a2.id);linkIt(it,a2,m.k,c.rule+' — confirmed',(a2.owners[it.v]||a2.owner)?null:g('own'))}
    toast('Account confirmed — lead #'+it.lead+' created for '+it.res);render();return}
  if(a==='nextmail'){const o=INBOX.find(x=>x.id===id),n={...o,id:'i'+NOW+Math.random(),at:NOW,subject:'Follow-up: '+o.subject.replace(/^Follow-up: /,''),st:null,lead:null,res:null};INBOX.push(n);autoMatch(n);toast(n.st==='auto'?'Linked by itself — learned from your confirmation.':'Still needs a check.');render();return}
  if(a==='linkmail'){const x=MAIL.find(z=>z.id===id),no=val('lk-'+id);if(!no){toast('Choose the lead to link to.');return}const L2=findL(no),R=L2.rfq,s=active(R);x.status='linked';x.lead=+no;x.why='Linked by '+m.n;log(L2,NOW,m.n,'Quote mail linked from queue','',x.subject,x.from+' → '+x.to);
    if(s&&s.i===7){const q=last(R);Object.assign(q,{status:'Submitted',sentAt:x.at,sentBy:L2.owner,sentTo:x.to,via:'Sent from Outlook — linked from queue'});s.end=Math.max(s.start,x.at);s.status='done';s.result=resOf(slaOf(7,R.pri),stepDur(s));const n=R.steps[8];n.start=s.end;n.status='active'}toast('Linked to #'+no+'; submission recorded.');render();return}
  if(a==='dismiss'){const x=MAIL.find(z=>z.id===id);x.status='dismissed';x.why='Not a quotation — '+m.n;render();return}
  if(a==='newlead'){S.open=null;S.page='leads';render();openNewLead();return}
  if(a==='nlsave'){saveNewLead();return}
}
/* new lead — account first, inline */
function openNewLead(){const v=document.getElementById('view');const d=document.createElement('section');d.className='card';d.id='nl';d.innerHTML=newLeadForm('', 'HT');v.insertBefore(d,v.children[1]);wireNL();document.getElementById('nl-q').focus()}
function newLeadForm(q,vv){const hits=q?ACC.map(a=>({a,s:Math.max(sim(q,a.name),a.name.toLowerCase().includes(q.toLowerCase())?.9:0)})).filter(x=>x.s>=.4).sort((x,y)=>y.s-x.s).slice(0,5):[];
  return `<div class="card-h"><h2>New lead</h2><p>Search the account first, so duplicates and blocked clients are caught before anything is created.</p></div><div class="form"><div class="frow"><div class="fld"><label for="nl-q">Customer</label><input id="nl-q" value="${esc(q)}" placeholder="Type a company name"></div><div class="fld"><label for="nl-v">Vertical</label><select id="nl-v">${Object.entries(VERT).map(([k,v])=>`<option value="${k}"${k===vv?' selected':''}>${v.n}</option>`).join('')}</select></div><div class="fld"><label for="nl-ch">How did this lead come?</label><select id="nl-ch">${CH.filter(c=>!AUTO_CH[c[0]]).map(c=>`<option value="${c[0]}">${c[1]}</option>`).join('')}</select><span class="hint">Inbound, repeat, director and tender leads are set automatically</span></div></div><div class="fld"><label for="nl-s">Requirement</label><input id="nl-s" placeholder="e.g. 80 T transformer, Vadodara → Mundra"></div>
  <div id="nl-res">${q?hits.map((x,k)=>{const [o,r]=ownerFor(x.a,vv);return `<label class="opt"><input type="radio" name="nla" value="${x.a.id}"${k===0&&!x.a.blocked?' checked':''}${x.a.blocked?' disabled':''}><span><b>${esc(x.a.name)}</b> <span class="sub">— owner for ${VERT[vv].n}: ${esc(nm(o))} (${esc(r)})${x.a.blocked?' · BLOCKED: '+esc(x.a.blocked.reason):''}</span></span></label>`}).join('')+`<label class="opt new"><input type="radio" name="nla" value="new"${hits.length?'':' checked'}><span><b>Create new account "${esc(q)}"</b> <span class="sub">— owner: ${esc(nm(VERT[vv].head))} (vertical head) until named</span>${hits.length?' <span class="t-amb">— similar accounts exist above</span>':''}</span></label>`:'<p class="sub" style="margin:0">Start typing — existing accounts appear first.</p>'}</div>
  <div class="acts"><button class="btn p" type="button" data-act="nlsave">Create lead</button></div></div>`}
function wireNL(){const q=document.getElementById('nl-q'),v=document.getElementById('nl-v');const up=()=>{const keep={q:q.value,v:v.value,s:document.getElementById('nl-s').value,ch:document.getElementById('nl-ch').value};document.getElementById('nl').innerHTML=newLeadForm(keep.q,keep.v);document.getElementById('nl-s').value=keep.s;document.getElementById('nl-ch').value=keep.ch;wireNL();const nq=document.getElementById('nl-q');nq.focus();nq.setSelectionRange(nq.value.length,nq.value.length)};q.oninput=up;v.onchange=up}
function saveNewLead(){const sel=(document.querySelector('input[name=nla]:checked')||{}).value,vv=val('nl-v'),s=val('nl-s'),q=val('nl-q'),m=me();
  if(!q||!sel){toast('Pick or create the customer account first.');return}if(!s){toast('Add the requirement in one line.');return}
  let a;if(sel==='new'){const bl=ACC.find(x=>x.blocked&&sim(q,x.name)>=.5);if(bl){toast(`"${q}" looks like blocked client ${bl.name}.`);return}a={id:ACC.length+1,name:q,v:vv,domains:[],gstin:'',contacts:[{n:'Contact to add',e:''}],learned:[],owners:{[vv]:VERT[vv].head},owner:VERT[vv].head,blocked:null,created:NOW,by:m.n,wins:0};ACC.push(a)}else a=ACC.find(x=>x.id===+sel);
  const [o,r]=ownerFor(a,vv),L=mkLead(a,val('nl-ch'),o);L.v=vv;L.scope=s;L.ownerRule=r;L.created=NOW;L.pre=1;L.preAt={0:NOW,1:NOW};L.no=++SER.lead;L.acts.push({at:NOW,by:m.k,kind:'Lead created',note:'Channel: '+chName(L.ch)});log(L,NOW,m.n,'Lead created','',a.name,'Owner '+nm(o)+' ('+r+')');LEADS.push(L);
  toast(o===m.k?`Lead #${L.no} created in your name.`:`Lead #${L.no} assigned to ${nm(o)} (${r}); you are recorded as creator.`);openLead(L.no)}

build();render();
})();
